# TEMPLATE — do NOT apply with these placeholder values. It lives under k8s/templates/ (like
# secret.yaml) so that the non-recursive `kubectl apply -f k8s/` never picks it up. The Ingress
# (k8s/templates/app-ingress.yaml) terminates TLS with the `toadie-tls` Secret; create it
# out-of-band.
#
# Local / throwaway: a self-signed certificate whose SAN is the Ingress host —
#
#   HOST=toadie.example.com
#   openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout tls.key -out tls.crt \
#     -subj "/CN=$HOST" -addext "subjectAltName=DNS:$HOST"
#   kubectl -n toadie create secret tls toadie-tls --cert=tls.crt --key=tls.key
#
# Browsers and curl (-k) must be told to trust it; the e2e suite does so with E2E_INSECURE_TLS=1.
#
# Real deployments: let cert-manager mint and renew it instead — annotate the Ingress with
# `cert-manager.io/cluster-issuer: <issuer>` and it writes this Secret for you; never commit
# key material.
apiVersion: v1
kind: Secret
metadata:
  name: toadie-tls
  namespace: toadie
type: kubernetes.io/tls
data:
  tls.crt: CHANGE-ME
  tls.key: CHANGE-ME
