# TEMPLATE — do NOT apply with these placeholder values (the app refuses to start on the
# placeholder JWT secret). It lives under k8s/templates/ so that `kubectl apply -f k8s/`
# (non-recursive) never picks it up: `kubectl apply` over an EXISTING Secret replaces its
# values, so applying this file would swap the real JWT_SECRET for the placeholder and the
# app would fail closed on its next restart — and a postgres volume initialised with the
# placeholder password keeps it, whatever the Secret says afterwards. Create the real secret
# out-of-band, BEFORE the first `kubectl apply -f k8s/`, and never commit it:
#
#   kubectl create namespace toadie
#   kubectl -n toadie create secret generic toadie-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_USER=toadie \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=ADMIN_INITIAL_PASSWORD='<choose-the-first-admin-password>' \
#     --from-literal=SMTP_USER='<smtp-username-or-empty>' \
#     --from-literal=SMTP_PASSWORD='<smtp-password-or-empty>'
#
# SMTP_USER/SMTP_PASSWORD feed the outbound-email transport (password reset, email MFA);
# they are read as optional — omit them when MAIL_TRANSPORT stays "disabled" or the
# SMTP relay needs no auth.
#
# ADMIN_INITIAL_PASSWORD rotates the seeded admin@toadie.local account away from the
# well-known 'changeme' on first boot; without it, production mode refuses to start.
#
# Rotating credentials LATER is a separate procedure from provisioning: the database password
# lives inside postgres once the volume is initialised — change it there (`ALTER ROLE toadie
# PASSWORD '…'`) AND in the Secret, then restart the app. Never delete the volume as a repair
# step for a mismatch; that deletes the workspace.
apiVersion: v1
kind: Secret
metadata:
  name: toadie-secrets
  namespace: toadie
type: Opaque
stringData:
  JWT_SECRET: CHANGE-ME-openssl-rand-hex-32
  POSTGRES_USER: toadie
  POSTGRES_PASSWORD: CHANGE-ME
  ADMIN_INITIAL_PASSWORD: CHANGE-ME
