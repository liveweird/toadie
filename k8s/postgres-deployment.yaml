apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: postgres
  name: postgres
  namespace: toadie
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: postgres
    spec:
      # postgres:18-alpine's `postgres` user is uid/gid 70. Running the pod as that user (rather than
      # letting the entrypoint start as root and drop to it through gosu) means the container never
      # holds root: with a non-root start the entrypoint skips its chown/gosu step and runs initdb as
      # uid 70 directly. fsGroup makes the PVC group-writable by gid 70 (a volume first initialised by
      # the former root start already belongs to 70:70, so existing data keeps working);
      # OnRootMismatch skips the recursive re-own once the volume root already matches.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            - name: POSTGRES_DB
              value: toadie
            # Credentials come from the `toadie-secrets` Secret (see k8s/templates/secret.yaml) so the
            # same values feed both this container and the app's connection settings.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: POSTGRES_USER
          image: postgres:18-alpine
          # Keep the probe command as a proper argv list (a single-string argv can't exec).
          # The readinessProbe gates the Service endpoint (the compose
          # `depends_on: service_healthy` equivalent).
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "toadie", "-d", "toadie"]
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "toadie", "-d", "toadie"]
            initialDelaySeconds: 10
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          name: toadie-postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              protocol: TCP
          # Demo-sized: PostgreSQL's default shared_buffers is 128 MB and the app's R2DBC pool caps at
          # 20 connections, so steady state sits well under the 256 MiB request; the 1 GiB limit leaves
          # room for an index build or autovacuum on top of a busy pool (page cache and /dev/shm count
          # against it too). No CPU limit (throttling a database only adds latency).
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            # postgres 18+ images keep data in a versioned subdir of /var/lib/postgresql
            # (PGDATA=/var/lib/postgresql/18/docker); mounting the pre-18 /var/lib/postgresql/data
            # path breaks the container.
            - mountPath: /var/lib/postgresql
              name: postgres-data
            # Writable scratch under readOnlyRootFilesystem: the server's unix socket and lock file
            # live in /var/run/postgresql, and /tmp holds temporary files. Everything else it writes
            # is under the data volume.
            - mountPath: /var/run/postgresql
              name: run
            - mountPath: /tmp
              name: tmp
      restartPolicy: Always
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
