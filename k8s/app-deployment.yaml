apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: toadie
spec:
  replicas: 1
  # RollingUpdate's default maxSurge briefly runs a second pod on every rollout, which would
  # violate the documented single-instance posture (instance-local login/reset throttles and
  # MFA challenges — .claude/docs/security.md); Recreate keeps exactly one app pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            # Secrets come from the `toadie-secrets` Secret — see k8s/templates/secret.yaml for how to
            # create it (never commit real values). The app fail-closes on placeholder/burned
            # JWT secrets and on unrotated seed passwords, so a misconfigured deploy crash-loops
            # instead of running with a backdoor.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: JWT_SECRET
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: ADMIN_INITIAL_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_JDBC_URL
              value: jdbc:postgresql://postgres:5432/toadie
            - name: POSTGRES_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/toadie
            # Production posture (the image default). For throwaway local-cluster testing over
            # plain HTTP (no TLS ingress), set this to "true" — HTTPS redirect / HSTS turn off
            # and the seed credentials are tolerated, exactly like the compose demo.
            - name: KTOR_DEVELOPMENT
              value: "false"
            # The app sits behind a TLS-terminating ingress (k8s/templates/app-ingress.yaml) that sets
            # X-Forwarded-For (replaced with the real client IP) + X-Forwarded-Proto/-Host, so rate
            # limiting keys on the real client and the HTTPS redirect sees the real scheme and
            # name. HTTP_PROXY_HOPS = trusted proxies that APPEND to X-Forwarded-For (1 = the
            # ingress alone; see application.yaml `http.proxyHops`).
            - name: HTTP_BEHIND_PROXY
              value: "true"
            - name: HTTP_PROXY_HOPS
              value: "1"
            # Machine GraphQL is opt-in. Missing ConfigMap/key preserves the server's false
            # default; set INTEGRATION_ENABLED="true" in toadie-config and restart to enable.
            - name: INTEGRATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: toadie-config
                  key: INTEGRATION_ENABLED
                  optional: true
            # Single sign-on (OIDC, Okta) is opt-in and ships off. Every key is optional: a missing
            # ConfigMap/key keeps SSO disabled (the server's default). To enable, set SSO_ENABLED="true"
            # plus SSO_ISSUER, SSO_CLIENT_ID and SSO_REDIRECT_URI in `toadie-config` and SSO_CLIENT_SECRET
            # in `toadie-secrets` (k8s/templates/secret.yaml), then restart; an incomplete set makes the
            # app refuse to start. The runbook is .claude/skills/run-stack/SKILL.md "Enable Okta SSO";
            # the rules are .claude/docs/security.md "SSO login (OIDC)".
            - name: SSO_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: toadie-config
                  key: SSO_ENABLED
                  optional: true
            - name: SSO_LABEL
              valueFrom:
                configMapKeyRef:
                  name: toadie-config
                  key: SSO_LABEL
                  optional: true
            - name: SSO_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: toadie-config
                  key: SSO_ISSUER
                  optional: true
            - name: SSO_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: toadie-config
                  key: SSO_CLIENT_ID
                  optional: true
            - name: SSO_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: toadie-config
                  key: SSO_REDIRECT_URI
                  optional: true
            - name: SSO_ALLOWED_EMAIL_DOMAINS
              valueFrom:
                configMapKeyRef:
                  name: toadie-config
                  key: SSO_ALLOWED_EMAIL_DOMAINS
                  optional: true
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: SSO_CLIENT_SECRET
                  optional: true
            # Outbound email (password reset, email MFA). Ships disabled — set "smtp" plus real
            # SMTP_HOST/MAIL_FROM to enable (production refuses the `log` transport). SMTP
            # credentials come from the Secret, the public URL from the ConfigMap below.
            - name: MAIL_TRANSPORT
              value: "disabled"
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_STARTTLS
              value: "true"
            - name: MAIL_FROM
              value: "toadie@localhost"
            # The public URL the emails link to — keep in step with the Ingress host
            # (k8s/templates/app-ingress.yaml) and the certificate SAN. Sourced from the
            # out-of-band `toadie-config` ConfigMap (key MAIL_APP_URL) so no per-deployment
            # hostname is baked into this file — `kubectl apply -f k8s/` is then safe to run
            # repeatedly without reverting a substituted host. optional: true → a missing key
            # leaves it blank, which the server tolerates with a startup WARN (link-less emails),
            # never a crash. Create it beside toadie-secrets, e.g.:
            #   kubectl -n toadie create configmap toadie-config --from-literal=MAIL_APP_URL=https://$HOST
            - name: MAIL_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: toadie-config
                  key: MAIL_APP_URL
                  optional: true
            # OpenTelemetry passthrough (.claude/docs/observability.md). The literals equal the code's
            # own defaults (core/.../OpenTelemetry.kt), so they change nothing until edited. To ship
            # to a collector, also set OTEL_EXPORTER_OTLP_ENDPOINT (and OTEL_EXPORTER_OTLP_PROTOCOL
            # when not http/protobuf) — deliberately not defaulted here, a default endpoint is not
            # neutral for gRPC.
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "console"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toadie-secrets
                  key: SMTP_PASSWORD
                  optional: true
          # Built locally with `docker build -t toadie-app:latest .`; OrbStack's
          # Kubernetes shares the Docker image store, so IfNotPresent uses it
          # directly (`:latest` would otherwise default to Always → registry pull).
          image: toadie-app:latest
          imagePullPolicy: IfNotPresent
          name: toadie-app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
              protocol: TCP
          # Sized for the tuned JVM baked into the image (SerialGC + -Xmx256m + C1): ~270 MiB RSS
          # under light load (a near-empty workspace). Request covers steady state; the 512 MiB limit
          # bounds it with headroom.
          # The whole-workspace read peak against this limit (2026-10-24 capacity probe) is recorded
          # in .claude/docs/security.md "Entity read memory budget" (Heap layout), together with the
          # native-memory bound the image sets (malloc arena cap, Dockerfile).
          # Re-examined in the 2026-09-20 checkup Tier 2 (2.13.1) and deliberately kept absent.
          resources:
            requests:
              cpu: "250m"
              memory: "320Mi"
            limits:
              memory: "512Mi"
          # Dedicated health endpoints (plugins/Health.kt), both unauthenticated and outside /api/:
          #   /healthz — liveness: process-alive only, never touches the DB (so a DB outage does
          #              NOT restart-storm the pod).
          #   /readyz  — readiness: a trivial DB round-trip; 503 while the DB is unreachable, so the
          #              pod is pulled from the Service until it can actually serve API traffic.
          # The startupProbe gives JVM boot + Flyway migrations (30 × 5s) before the liveness clock starts, so a
          # slow first boot cannot trigger a restart. That budget must also cover Flyway waiting for PostgreSQL on
          # a fresh deploy: keep it above ktor.application.startupTimeoutMillis (pinned by
          # web/src/test/infrastructure.test.js; reasoning in .claude/docs/persistence.md "Cold start").
          # Every probe sends X-Forwarded-Proto: https — the header the TLS-terminating ingress sets
          # (HTTP_BEHIND_PROXY above makes the app trust it). Without it, production mode answers the
          # plain-HTTP probe with a 301 to https://<pod-ip>/, which the kubelet FOLLOWS (same host)
          # into a refused :443 — probes never pass and the pod crash-loops (Lettuce's v3.6.1
          # incident, reproduced here by the 2026-09-05 deployment audit).
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            # Above the handler's own 2 s ceiling (READYZ_TIMEOUT_MS in plugins/Health.kt), so an
            # unreachable database surfaces as the app's 503, not as the kubelet's client timeout.
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # Writable /tmp under readOnlyRootFilesystem: the JVM writes hsperfdata and Netty extracts its native transport library into java.io.tmpdir; nothing else on the image is written at runtime (Dockerfile runs as uid 10001, owns only /app).
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
