apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: toadie
spec:
  # OrbStack provisions local LoadBalancers; `kubectl -n toadie port-forward svc/app` is
  # the fallback. Port 8081 (not 8080) so Toadie's LB can coexist with Lettuce's.
  type: LoadBalancer
  ports:
    - name: "8081"
      port: 8081
      targetPort: 8081
  selector:
    io.kompose.service: app
