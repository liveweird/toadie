apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: toadie
spec:
  # ClusterIP: the Ingress (k8s/templates/app-ingress.yaml) fronts the app; for pod-direct
  # debugging use `kubectl -n toadie port-forward svc/app 8081:8081` (production mode then
  # answers a 301 unless you send `X-Forwarded-Proto: https`). Switching a live LoadBalancer
  # Service to ClusterIP can be rejected (allocated nodePort) — `kubectl -n toadie delete svc app`
  # first, then apply. Port 8081 (not 8080) so Toadie coexists with Lettuce on one cluster.
  type: ClusterIP
  ports:
    - name: "8081"
      port: 8081
      targetPort: 8081
  selector:
    io.kompose.service: app
