apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: postgres-data
  name: postgres-data
  namespace: toadie
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Initial production-sized allocation. Monitor actual PostgreSQL use and grow before
      # 70%; the sizing and expansion procedure lives in k8s/BACKUP-RESTORE.md.
      storage: 10Gi
