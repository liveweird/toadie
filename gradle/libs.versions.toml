[versions]
graphql-java = "26.1"
angus-mail = "2.0.5"
bcrypt = "0.10.2"
# detekt 1.23.x embeds a pre-2.x Kotlin compiler — fine for the plain rule sets we run
# (no type resolution); revisit the detekt 2.x line once it has a stable release.
detekt = "1.23.8"
# Exposed pinned at 1.3.1: 1.4.0 stalls R2DBC work under full-suite load in Lettuce (a
# likely connection-release regression; fine in isolation). Re-try at the next release
# with a full :server:test --rerun-tasks.
exposed = "1.5.0"
flyway = "13.9.0"
# jq 1.6 semantics for `calculationProperties` (Phase 5, `.claude/docs/port-data-model.md`);
# Apache 2 licensed. Brings jackson-databind onto the compile classpath (previously runtime/test
# only, via com.auth0:java-jwt) plus org.jruby.joni — see `--write-locks` diff.
jackson-jq = "1.6.5"
# Advisory floors (the Trivy lockfile scan, `.claude/docs/testing.md`). Nothing here declares Jackson
# or SCRAM directly: java-jwt and jackson-jq bring jackson-databind, r2dbc-postgresql brings the
# SCRAM client. The platform/constraints in server/build.gradle.kts hold them at or above the fixed
# versions: jackson 2.22.3 (CVE-2026-68494/-68497/-89407/-89425/-91776/-91777 and the databind
# pair CVE-2026-54512/-54513, all HIGH) and scram 3.3 (CVE-2026-53712, authentication downgrade via
# TLS channel binding). KNOWN GAP: the JDBC driver (`postgresql` below, used only by Flyway at boot)
# SHADES its own scram-client 3.2 under org/postgresql/shaded/ - no constraint reaches it and the
# lockfile scan cannot see it. Exposure needs a TLS connection to PostgreSQL (channel binding); the
# compose and Kubernetes stacks connect in plain text in-cluster. On every driver bump, check the
# jar's META-INF/licenses/com.ongres.scram/ folder and drop this note once it bundles >= 3.3.
jackson-bom = "2.22.3"
kotlin = "2.4.20"
kover = "0.9.11"
logback = "1.6.5"
# The MCP endpoint groundwork (release 2.15.0): pulls in ktor-server-sse transitively at an
# older Ktor line — the explicit ktorLibs.server.sse dependency below keeps every Ktor artifact
# on the repo's own 3.6.0 catalog line (see server/build.gradle.kts).
mcp-kotlin-sdk = "0.15.0"
# Netty alignment: Ktor's engine ships Netty 4.2 while r2dbc-postgresql 1.1.3 asks for reactor-netty
# 1.1.22 (built on 4.1.112) - Gradle lifted the shared modules to 4.2 and left the DNS/proxy modules
# only reactor-netty uses at 4.1.112 (CVE-2026-42579/-45674/-47691), a mixed classpath under the
# driver's hostname resolution. reactor-netty 1.3.x is built on Netty 4.2 (1.3.7 -> 4.2.17), and the
# BOM pins EVERY io.netty module to one version, Ktor's included. Keep the two in step: reactor-netty
# is versioned by the `reactor-bom` line below (read its Netty version off reactor-netty's pom).
netty = "4.2.17.Final"
opentelemetry = "1.66.0"
opentelemetry-ktor = "2.32.0-alpha"
opentelemetry-semconv = "1.44.0"
okhttp = "5.5.0"
r2dbc-postgresql = "1.1.3.RELEASE"
# Bounded connection pooling over the plain R2DBC connection factory (Database.kt) — compatible
# with the r2dbc-spi 1.0.0.RELEASE already pulled in transitively by r2dbc-postgresql.
r2dbc-pool = "1.0.2.RELEASE"
# Reactor alignment: reactor-core, reactor-pool and reactor-netty legitimately carry DIFFERENT version
# numbers (3.8.7 / 1.2.7 / 1.3.7), so the Reactor BOM (upstream's pairing table) pins every
# io.projectreactor* module to one release train. r2dbc-pool 1.0.2 alone would pull reactor-pool 1.0.8
# (a reactor-core 3.5-era pairing). Moving this line moves reactor-netty - keep it in step with the
# `netty` pin above.
reactor-bom = "2025.0.7"
scram = "3.3"
swagger-request-validator = "3.0.0"
testcontainers = "2.0.5"

[libraries]
graphql-java = { module = "com.graphql-java:graphql-java", version.ref = "graphql-java" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-mail" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson-bom" }
jackson-jq = { module = "net.thisptr:jackson-jq", version.ref = "jackson-jq" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mcp-kotlin-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-kotlin-sdk" }
opentelemetry-exporterLogging = { module = "io.opentelemetry:opentelemetry-exporter-logging", version.ref = "opentelemetry" }
opentelemetry-exporterOtlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-logbackAppender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-ktor" }
opentelemetry-ktorInstrumentation = { module = "io.opentelemetry.instrumentation:opentelemetry-ktor-3.0", version.ref = "opentelemetry-ktor" }
opentelemetry-sdkAutoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure", version.ref = "opentelemetry" }
opentelemetry-semconv = { module = "io.opentelemetry.semconv:opentelemetry-semconv", version.ref = "opentelemetry-semconv" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.13" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "r2dbc-pool" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbc-postgresql" }
reactor-bom = { module = "io.projectreactor:reactor-bom", version.ref = "reactor-bom" }
reactor-netty-core = { module = "io.projectreactor.netty:reactor-netty-core" }
reactor-pool = { module = "io.projectreactor.addons:reactor-pool" }
scram-client = { module = "com.ongres.scram:scram-client", version.ref = "scram" }
scram-common = { module = "com.ongres.scram:scram-common", version.ref = "scram" }
swagger-request-validator-core = { module = "com.atlassian.oai:openapi-request-validator-core", version.ref = "swagger-request-validator" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
