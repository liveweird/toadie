# Repo-specific detekt tuning, layered on top of the bundled defaults (buildUponDefaultConfig).
# Policy: fix findings in code first; add a rule override here ONLY for a deliberate repo idiom,
# and give every override a one-line comment naming that idiom. No baseline file.

complexity:
  # Route registration is declarative by architecture — each feature's configureXxxRoutes lists
  # every endpoint in one function (see "Package layout" in CLAUDE.md), so *Routes.kt files are
  # exempt from method-size/complexity rules; services and helpers are not. Plugin installers
  # (plugins/*.kt — Http, ErrorHandling, Security) are declarative in the same way: one
  # configureXxx listing every `install {}` block. Tests are exempt from LongMethod: scenario
  # tests are named sentences and read top-to-bottom. Threshold 80 (detekt default 60) — the
  # longest remaining service functions (EntityService.graph, CatalogFileService.loadRegistrySnapshot)
  # sit in the 60s and are one cohesive read each.
  LongMethod:
    excludes: ['**/src/test/**', '**/*Routes.kt', '**/plugins/*.kt']
    threshold: 80
  CyclomaticComplexMethod:
    excludes: ['**/*Routes.kt']
    threshold: 25
  # Data-only wire DTOs (LoginResponse, CatalogFileResponse, ImportFileResult) and test
  # fixture builders carry naturally wide signatures, plus a handful of multi-argument
  # service/route helpers (CatalogFileService.create, BlueprintImport.classifyOne — one
  # parameter per independently-validated input, not entangled control flow); nothing
  # behavioral hides in either shape.
  LongParameterList:
    excludes: ['**/src/test/**']
    functionThreshold: 12
    constructorThreshold: 12
  # One cohesive service per feature is the architecture (UserService, CatalogFileService)
  # — splitting them by function count would fork feature logic across files — and the pure
  # rule-table helper files are the same idiom one level down: one function per validation
  # rule reads best flat (entities/EntityValidation.kt, 30 functions; blueprints/
  # PropertyValidation.kt, 23).
  TooManyFunctions:
    active: false
  # Per-feature route test suites are deliberately comprehensive (one file per feature).
  LargeClass:
    excludes: ['**/src/test/**']
  # The documented guard/validation matrices (the last-admin checks, sanitizedCatalogFile's
  # branches) read best as single multi-clause conditions — the clause count IS the rule width.
  ComplexCondition:
    threshold: 5
  # The OpenAPI conformance report writer (test infra) nests report sections naturally.
  NestedBlockDepth:
    excludes: ['**/src/test/**']

exceptions:
  # ACTIVE (the detekt default): a generic catch is allowed only at the documented best-effort
  # boundaries, each carrying a per-site @Suppress with a one-line justification — the import
  # loops' per-document isolation (catalog/CatalogFileImport.kt, blueprints/BlueprintImport.kt,
  # entities/EntityImport.kt: report & skip), the URL fetch's upstream classification
  # (catalog/UrlFetch.kt: every failure a safe 502), the mail-send boundaries (auth/MfaEmail.kt,
  # auth/PasswordResetEmail.kt: a delivery failure must never crash the request), and the jq
  # evaluation boundary (entities/JqCalculation.kt: an admin-authored expression's failure
  # answers absent). Every such site rethrows cancellation first and logs or classifies the
  # exception rather than swallowing it. A NEW generic catch is a finding until it earns its
  # own justified suppression — the rule stays on so the list cannot grow silently.
  TooGenericExceptionCaught:
    active: true

naming:
  # Feature files pair the typed-routing Resource declaration with the configureXxx extension
  # (UserRoutes.kt holds `Users` + `configureUserRoutes`); file names follow the feature-local
  # layout convention, not the first declaration. The same multi-declaration-per-file idiom
  # covers plain helper files too: authz/Principal.kt (CallerPrincipal + caller()),
  # catalog/CatalogFileFilter.kt (CatalogFileListFilter + the shared predicate/matcher
  # functions), plugins/ErrorHandling.kt (ProblemDetail + configureErrorHandling), and
  # plugins/Security.kt (JwtConfig + configureSecurity).
  MatchingDeclarationName:
    active: false
  # The source layout is feature-first under src/main/kotlin/<feature>/ without the
  # ch/nokillswit prefix directories (Ktor scaffolding style) — deliberate, repo-wide.
  InvalidPackageDeclaration:
    active: false

performance:
  # Varargs pass-through (audit(event, *fields), typed-route params) — the array copy is
  # irrelevant at this service's traffic, and the call sites read better.
  SpreadOperator:
    active: false

style:
  # The per-field validation convention (validate* helpers throwing BadRequestException per
  # check — see "Request payload validation" in .claude/docs/security.md) and route handlers
  # throwing typed authz/domain exceptions make throw counts meaningless here.
  ThrowsCount:
    active: false
  # Wildcard imports are idiomatic throughout for the three high-arity dependencies: Ktor
  # (io.ktor.server.application.* etc.), Exposed (org.jetbrains.exposed.* — the query DSL pulls
  # in dozens of extension functions per file), and Codahale/Dropwizard metrics
  # (plugins/Monitoring.kt).
  WildcardImport:
    active: false
  # Exposed column widths, time math (* 1000, / 60), bcrypt costs, and the descriptor-format
  # caps are self-describing domain literals; naming each would hurt readability.
  MagicNumber:
    active: false
  # De-facto wrap is ~120, but assertion lines and bilingual copy run longer; 140 is the gate.
  MaxLineLength:
    maxLineLength: 140
  # Guard-clause early returns are the documented authz evaluation-order idiom (Guards.kt
  # evaluates the read matrices rule-by-rule, cheapest first).
  ReturnCount:
    max: 6
  # Guard-continues in row-independent sweep loops (the graph's reference expansion, the
  # anonymous-access spec sweep) — each continue is one skip rule, not control-flow spaghetti.
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  # Unused imports are off in detekt's defaults (deprecated in favour of the ktlint wrapper,
  # which is not installed); enabled here so helper-extraction leftovers can't accumulate
  # (2026-08 review round found 16). If it ever false-positives on KDoc-only usage, prefer
  # fixing the KDoc reference over disabling.
  UnusedImports:
    active: true
