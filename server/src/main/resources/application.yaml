ktor:
  # Development default for :server:run and tests; the Docker image ships
  # KTOR_DEVELOPMENT=false (production mode: JWT/seed fail-closed checks active,
  # HSTS + HTTPS redirect on).
  development: "$KTOR_DEVELOPMENT:true"
  deployment:
    port: 8081
    # Netty's default request-line ceiling is 4096 bytes; a 2000-character entity query
    # (phase 7, 2.0.0 — MAX_QUERY_LENGTH) URL-encodes to roughly 6 KB on
    # `GET /api/v1/entities/graph?query=`. 16 KiB leaves headroom and stays within
    # ingress-nginx's default `large_client_header_buffers 4 8k` (8 KB per header line).
    maxInitialLineLength: 16384
  application:
    # Ktor fails the boot when module loading takes longer than this (default 10 s), checked once loading next
    # suspends — i.e. AFTER a blocking Flyway connect-retry wait returned. Raised so the cold-start wait fits;
    # FlywayConnectRetriesTest boots through it. Rationale and numbers: persistence.md "Cold start".
    startupTimeoutMillis: 140000
    modules:
      # — base plugins
      - ch.nokillswit.plugins.HttpKt.configureHttp
      - ch.nokillswit.plugins.SecurityHeadersKt.configureSecurityHeaders
      - ch.nokillswit.plugins.MonitoringKt.configureMonitoring
      - ch.nokillswit.plugins.SerializationKt.configureSerialization
      - ch.nokillswit.plugins.SecurityKt.configureSecurity
      - ch.nokillswit.plugins.ErrorHandlingKt.configureErrorHandling
      - ch.nokillswit.plugins.OpenTelemetryKt.configureOpenTelemetry
      - ch.nokillswit.plugins.AutoHeadResponseKt.configureAutoHeadResponse
      - ch.nokillswit.plugins.ResourcesKt.configureResources
      # — infrastructure
      - ch.nokillswit.infra.mail.MailKt.configureMail
      - ch.nokillswit.infra.db.FlywayKt.configureFlyway
      - ch.nokillswit.infra.db.DatabaseKt.configureDatabase
      - ch.nokillswit.infra.db.BootstrapKt.configureBootstrap
      # The in-app telemetry sampler (`.claude/docs/observability.md` "Telemetry"): reads DatabaseKey and ConnectionPoolKey, so after
      # the database group; the pressure seams it samples are read at ApplicationStarted, after every module has published them.
      - ch.nokillswit.telemetry.TelemetryKt.configureTelemetry
      # Health endpoints (/healthz liveness, /readyz readiness) — the readiness handler reads the
      # dictionary service from attributes, so after the infrastructure group; a real route, so
      # before the SPA catch-all below.
      - ch.nokillswit.plugins.HealthKt.configureHealth
      # — features
      - ch.nokillswit.users.UserRoutesKt.configureUserRoutes
      - ch.nokillswit.catalog.CatalogFileRoutesKt.configureCatalogFileRoutes
      - ch.nokillswit.dictionaries.DictionaryRoutesKt.configureDictionaryRoutes
      - ch.nokillswit.labels.LabelRoutesKt.configureLabelRoutes
      - ch.nokillswit.tags.TagCategoryRoutesKt.configureTagCategoryRoutes
      - ch.nokillswit.types.EntityTypesRoutesKt.configureEntityTypesRoutes
      - ch.nokillswit.annotations.AnnotationKeyRoutesKt.configureAnnotationKeyRoutes
      - ch.nokillswit.lenses.LensRoutesKt.configureLensRoutes
      - ch.nokillswit.blueprints.BlueprintRoutesKt.configureBlueprintRoutes
      - ch.nokillswit.entities.EntityRoutesKt.configureEntityRoutes
      - ch.nokillswit.entityquery.SavedEntityQueryRoutesKt.configureSavedEntityQueryRoutes
      - ch.nokillswit.conversion.ConversionMappingRoutesKt.configureConversionMappingRoutes
      - ch.nokillswit.auth.AuthRoutesKt.configureAuthRoutes
      - ch.nokillswit.auth.PasswordResetRoutesKt.configurePasswordResetRoutes
      # The ADMIN telemetry reads (`.claude/docs/observability.md` "Telemetry"): after configureAuthRoutes, which installs the
      # RateLimit plugin and registers the per-user `telemetry` bucket the routes mount; the pressure seams are read per request.
      - ch.nokillswit.telemetry.TelemetryRoutesKt.configureTelemetryRoutes
      # — catch-all router
      - ch.nokillswit.integration.IntegrationClientRoutesKt.configureIntegrationClientRoutes
      - ch.nokillswit.integration.IntegrationKt.configureIntegration
      - ch.nokillswit.plugins.RoutingKt.configureRouting

security:
  # Per-account login lockout (complements the per-IP rate limit): after `threshold`
  # consecutive failures for one email, further attempts are 429 for `durationSeconds`.
  # A successful login resets the counter. In-memory, per-instance.
  lockout:
    threshold: "$LOGIN_LOCKOUT_THRESHOLD:5"
    durationSeconds: "$LOGIN_LOCKOUT_DURATION_SECONDS:900"
  # Per-IP token bucket on POST /api/v1/login. The per-account lockout above is the
  # actual brute-force defence and is unaffected by this. Blank FOLLOWS THE MODE:
  # 10/min in production, 1000/min in development — the e2e suite drives many logins
  # from a single host and would otherwise spend minutes sleeping out the bucket.
  # Set a number to pin it in either mode.
  rateLimit:
    loginPerMinute: "$LOGIN_RATE_LIMIT_PER_MINUTE:"
    # Blank keeps the default 30/min (both modes); a number pins it.
    refreshPerMinute: "$REFRESH_RATE_LIMIT_PER_MINUTE:"
    # Per-IP bucket on POST /api/v1/password-reset. Blank FOLLOWS THE MODE (5/min in
    # production, 100/min in development — the loginPerMinute rationale); a number pins it.
    # The per-EMAIL reset throttle below is the actual abuse defence in both modes.
    passwordResetPerMinute: "$PASSWORD_RESET_RATE_LIMIT_PER_MINUTE:"
    # Per-IP bucket on /integration/* (GraphQL + MCP). Blank FOLLOWS THE MODE (300/min in
    # production, 3000/min in development — the e2e GraphQL smoke and the Playwright suite drive
    # from one host); a number pins it. Sits above the 120/min per-key bucket, so several keys
    # behind one NAT can still collide — raise it in that deployment.
    integrationPerMinute: "$INTEGRATION_RATE_LIMIT_PER_MINUTE:"
  # Self-service password reset: at most one request per submitted email per interval,
  # uniformly whether or not the account exists. In-memory, per-instance, like the lockout.
  passwordReset:
    minIntervalSeconds: "$PASSWORD_RESET_MIN_INTERVAL_SECONDS:60"
    # Persisted, single-use reset links; at most one hour. Requests never change passwords.
    tokenTtlSeconds: "$PASSWORD_RESET_TOKEN_TTL_SECONDS:900"
  # Email MFA (opt-in per user via the MFA feature flag): a login with correct credentials
  # mints a challenge and emails a 6-digit code; the code must come back to
  # POST /api/v1/login/mfa within the TTL and attempt cap. Challenges are in-memory,
  # per-instance, like the lockout above (a restart just means signing in again).
  mfa:
    codeTtlSeconds: "$MFA_CODE_TTL_SECONDS:300"
    maxAttempts: "$MFA_MAX_ATTEMPTS:5"
  csrf:
    # TEMPLATE PLACEHOLDER — CSRF protection is off by default because this API
    # authenticates via bearer JWT in the Authorization header, which browsers
    # do not auto-attach to cross-origin requests. Enable only if you move to
    # cookie-based session auth.
    enabled: "$SECURITY_CSRF_ENABLED:false"

# Computed-property evaluation (phase 5): admin-authored jq calculation expressions run on a
# bounded daemon pool (4 workers, 64 queued — code constants in entities/JqCalculation.kt) under
# a per-expression deadline. An expression that misses it is ABSENT from the entity and stays
# quarantined until its text changes or the server restarts; jackson-jq ignores interruption,
# so the cancelled evaluation's worker stays busy until the expression finishes. See
# .claude/docs/security.md "Computed-property evaluation (jq)".
computed:
  jq:
    deadlineMillis: "$JQ_DEADLINE_MILLIS:500"

# Entity query evaluation (phase 7, 2.0.0): a `query` on GET /api/v1/entities/graph is evaluated
# in memory over the active workspace under this per-query deadline (cooperative checkpoints in
# entityquery/QueryBudget.kt); a miss is a 400 with DEADLINE_EXCEEDED. Valid range 1..60000.
entityQuery:
  deadlineMillis: "$ENTITY_QUERY_DEADLINE_MILLIS:2000"

jwt:
  secret: "$JWT_SECRET:secret"
  issuer: "$JWT_ISSUER:http://0.0.0.0:8081/"
  audience: "$JWT_AUDIENCE:toadie-api"
  realm: "$JWT_REALM:toadie-api"
  # Short-lived access token used as the API bearer; the SPA silently refreshes it.
  accessExpiresInSeconds: "$JWT_ACCESS_EXPIRES_IN_SECONDS:900"
  # Longer-lived refresh token exchanged at POST /api/v1/refresh. Pure-sliding: each
  # refresh mints a fresh pair, so an idle session ends only after this window elapses.
  refreshExpiresInSeconds: "$JWT_REFRESH_EXPIRES_IN_SECONDS:3600"

bootstrap:
  # When set and the V3 seed admin still has the well-known "changeme" password,
  # it is rotated to this value at startup (idempotent — a later admin-chosen
  # password is never overwritten). Outside development mode, startup FAILS if
  # any account still carries the seed password.
  adminInitialPassword: "$ADMIN_INITIAL_PASSWORD:"

http:
  # Set true when the app runs behind a reverse proxy / ingress that terminates TLS.
  # Installs XForwardedHeaders so the client IP (rate limiting) and scheme (HTTPS
  # redirect) come from X-Forwarded-* headers. The proxy MUST set X-Forwarded-For,
  # X-Forwarded-Proto and X-Forwarded-Host (the app reads only those; X-Forwarded-Port is
  # ignored) and overwrite client-supplied values — k8s/templates/app-ingress.yaml
  # is the reference (ingress-nginx does so by default). Several X-Forwarded-For header
  # lines are folded in the order received before the hop selection below.
  behindProxy: "$HTTP_BEHIND_PROXY:false"
  # Trusted proxies in front of the app when behindProxy is true (default 1 = the
  # ingress alone). X-Forwarded-For is read from the END of the list: 1 trusts the
  # value the last proxy wrote; N skips the N-1 addresses trusted proxies appended
  # after the client's. Only count proxies that APPEND (nginx
  # proxy_add_x_forwarded_for, ingress-nginx with compute-full-forwarded-for);
  # ingress-nginx's default REPLACES the header, so 1 is right. Anything before the
  # values your proxies wrote is client-supplied and spoofable — never the first value.
  proxyHops: "$HTTP_PROXY_HOPS:1"
  # Comma-separated cross-origin hosts allowed to call the API (e.g.
  # "app.example.com,other.example.com:8443"). Empty (the default) = CORS is not
  # installed at all: production is single-origin (Ktor serves the SPA) and local
  # dev goes through the Vite proxy, so no cross-origin caller exists.
  corsHosts: "$CORS_ALLOWED_HOSTS:"
  # Swagger UI + the OpenAPI spec at /openapi. Blank (default) = follow the mode:
  # served in development, hidden in production. Set "true" to expose them in a
  # trusted production environment, "false" to hide them even in development.
  exposeOpenApi: "$HTTP_EXPOSE_OPENAPI:"

web:
  # When set, the server serves the built React SPA from this directory (static
  # assets + SPA fallback to index.html). Empty in local dev, where Vite serves
  # the SPA on :5174; set to /app/web inside the Docker image.
  staticDir: "$WEB_STATIC_DIR:"

mail:
  # Outbound-email transport (infra/mail/Mail.kt): `log` (dev default — messages,
  # including generated passwords, go to the ch.nokillswit.mail logger instead of
  # being sent; production startup REFUSES it), `smtp` (real delivery; blank host
  # refuses startup in any mode), or `disabled` (the Docker image default — email
  # features answer 503).
  transport: "$MAIL_TRANSPORT:log"
  smtp:
    host: "$SMTP_HOST:"
    port: "$SMTP_PORT:587"
    user: "$SMTP_USER:"
    password: "$SMTP_PASSWORD:"
    startTls: "$SMTP_STARTTLS:true"
  from: "$MAIL_FROM:toadie@localhost"
  # Optional absolute URL of this deployment (e.g. https://toadie.example.com);
  # when set, outbound emails include a sign-in link.
  appUrl: "$MAIL_APP_URL:"

postgres:
  # Local-dev defaults point at the docker-compose Postgres, which maps host port
  # 5433 (not 5432 — Lettuce may occupy it on the same machine).
  jdbcUrl: "$POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5433/toadie"
  r2dbcUrl: "$POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5433/toadie"
  user: "$POSTGRES_USER:toadie"
  password: "$POSTGRES_PASSWORD:toadie"
  # How many times Flyway retries its boot connection with a capped doubling back-off (0 = fail fast, 0..15), so a
  # cold start waits for PostgreSQL instead of crash-looping — infra/db/Flyway.kt, persistence.md "Cold start".
  connectRetries: "$POSTGRES_CONNECT_RETRIES:10"
  # Bounded R2DBC connection pool (infra/db/Database.kt, `.claude/docs/persistence.md`
  # "Connection pool") — a plain r2dbc:postgresql:// connect opens one PostgreSQL backend
  # per suspendTransaction with nothing capping how many run at once. Sizing assumes a
  # SINGLE replica: `maxSize × replicas` must stay well under PostgreSQL's default
  # `max_connections = 100`, with room left for Flyway's one short-lived JDBC connection
  # (infra/db/Flyway.kt) and any other client.
  pool:
    # The ceiling on concurrent pooled connections for this instance.
    maxSize: "$POSTGRES_POOL_MAX_SIZE:20"
    # Connections opened eagerly at pool creation (warm start for the first requests).
    initialSize: "$POSTGRES_POOL_INITIAL_SIZE:2"
    # How long a caller waits for a free connection before failing (surfaces as a 500 —
    # see "Connection pool" in persistence.md — rather than a new declared status).
    maxAcquireTimeSeconds: "$POSTGRES_POOL_MAX_ACQUIRE_SECONDS:10"
    # How long an idle pooled connection may sit before the pool recycles it.
    maxIdleTimeSeconds: "$POSTGRES_POOL_MAX_IDLE_SECONDS:600"
    # The longest a pooled connection lives before the pool replaces it (checked on acquire, on
    # release and by the background sweep), so a backend killed or restarted server-side is not
    # kept for the lifetime of the process.
    maxLifeTimeSeconds: "$POSTGRES_POOL_MAX_LIFE_SECONDS:1800"
    # PostgreSQL's idle_in_transaction_session_timeout on every pooled connection (0 = off): the
    # server ends a session left idle inside an open transaction, releasing its locks. Toadie's
    # longest transaction is ~0.5 s, so 300 s is a very wide margin — see "Connection pool" in
    # persistence.md. Sent as a startup parameter; an `options=` already in the r2dbc URL wins.
    idleInTransactionTimeoutSeconds: "$POSTGRES_POOL_IDLE_IN_TRANSACTION_TIMEOUT_SECONDS:300"
    # Bounding a HUNG database (one that accepts or holds connections but never answers), which
    # nothing else bounds: the driver has no socket read timeout. Every acquire validates the
    # connection with a round trip (ValidationDepth.REMOTE), failing after this many seconds — a
    # frozen or server-killed connection is discarded instead of handed to a request. A hung
    # database holds a request at most ~2 x maxAcquireTimeSeconds (r2dbc-pool retries a timed-out
    # acquire once) before the catch-all 500 (and /readyz 503).
    maxValidationTimeSeconds: "$POSTGRES_POOL_MAX_VALIDATION_SECONDS:5"
    # Creating a new connection (TCP connect + startup/auth handshake) fails after this long.
    maxCreateConnectionTimeSeconds: "$POSTGRES_POOL_MAX_CREATE_SECONDS:10"
  # The TCP connect alone (the driver's connectTimeout; Netty's default is 30 s).
  connectTimeoutSeconds: "$POSTGRES_CONNECT_TIMEOUT_SECONDS:10"
  # PostgreSQL's server-side statement_timeout for every pooled connection: a statement a LIVE but
  # stuck server runs longer (a lock wait, a runaway query) is cancelled. 0 = no limit. Toadie's
  # statements and per-document transaction holds are ~100 ms; Flyway's JDBC connection is not
  # affected. Set through Exposed's defaultQueryTimeout (Database.kt), never a driver option.
  statementTimeoutSeconds: "$POSTGRES_STATEMENT_TIMEOUT_SECONDS:30"
  # Client-side deadline on every exchange with the database (ResponseDeadline.kt): the driver has no
  # read timeout, so a statement already on the wire when the server froze would otherwise wait for the
  # thaw. Must exceed statementTimeoutSeconds (boot-checked) so the server's own cancel wins on a live
  # server, and a non-zero value requires a non-zero statementTimeoutSeconds; 0 = off. See persistence.md "Response deadline: every exchange below the pool".
  responseTimeoutSeconds: "$POSTGRES_RESPONSE_TIMEOUT_SECONDS:45"

monitoring:
  # How often the Dropwizard registry is dumped to the `metrics` logger (plugins/Monitoring.kt). 0 = off (metrics are still
  # collected); otherwise 30..3600. Was a fixed 10 s: a dump every 10 s, with the JVM gauge sets enumerating every thread, was a
  # steady idle-allocation and log-volume cost for lines nothing consumes; five minutes still leaves a trail to look back on.
  reporterIntervalSeconds: "$METRICS_REPORT_INTERVAL_SECONDS:300"

telemetry:
  # The in-app telemetry sampler (telemetry/, `.claude/docs/observability.md` "Telemetry"): the process writes its own
  # memory/JVM/pool/pressure/requests/workspace figures to telemetry_samples. All values are validated on every boot, enabled or not.
  enabled: "$TELEMETRY_ENABLED:true"
  # How often the process samples itself (whole seconds, 60..1800 and a divisor of 3600, so an hour's samples tile it); stored as
  # the raw rows' `resolution`. Also the window of the request timers, capped at 300.
  sampleIntervalSeconds: "$TELEMETRY_SAMPLE_INTERVAL_SECONDS:300"
  # How often the workspace sizes and counts are measured (900..86400).
  storageIntervalSeconds: "$TELEMETRY_STORAGE_INTERVAL_SECONDS:3600"

# Read-only Port integration API; admin key management remains available when disabled.
integration:
  enabled: "$INTEGRATION_ENABLED:false"
