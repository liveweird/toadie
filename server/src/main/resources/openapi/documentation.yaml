openapi: 3.1.0
info:
  title: toadie-api
  version: 1.0.0
  description: |
    JWT-authenticated REST API for Toadie — a Backstage `catalog-info.yaml` helper
    (visual creation with validation, cross-file reference checking, combined rendering).
    Exposes the authentication surface plus catalog-file storage (visual creation).

    Authorization model: every user is implicitly a regular user; additional global roles
    (`ADMIN`) are carried as the `roles` array and only ever ADD privileges on top of that
    baseline. `ADMIN` is the management role: it may reset any user's password (and will own
    future management surfaces).

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`).
    Any endpoint may additionally return `500` (`InternalServerError`) on an
    unexpected server fault.
servers:
  - url: http://localhost:8081
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: catalog-files

paths:
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal. Accepts a valid, unexpired, non-revoked refresh token and
        returns a brand-new access token and refresh token (each with a full TTL). The presented
        refresh token is left valid until its own expiry — it is not rotated out. Requires no
        `Authorization` header (the access token may already be expired). Returns `401` for a
        missing/invalid/expired/revoked refresh token, if the user no longer exists, or if the
        token was minted before the user's most recent password change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/catalog-files:
    get:
      tags: [catalog-files]
      operationId: listCatalogFiles
      summary: List stored catalog files
      description: |
        Lists the stored catalog-info.yaml files (shared workspace — every authenticated user
        sees every file).

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `namespace`, `updatedAt`. Default sort is `id`
          ascending; `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` — case- and accent-insensitive substring match against the entity name.
          - `namespace` — exact match (case-insensitive; namespaces are stored lowercase).

        Each returned item includes the creator's `creatorName` resolved via join so the UI
        does not need an N+1 lookup.

        Malformed query parameters (unknown sort field, out-of-range page/pageSize, repeated
        scalar keys) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the entity name.
        - name: namespace
          in: query
          required: false
          schema: { type: string }
          description: Exact (case-insensitive) namespace match.
      responses:
        '200':
          description: A page of catalog files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFilePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [catalog-files]
      operationId: createCatalogFile
      summary: Create a catalog file
      description: |
        Stores a new catalog-info.yaml document (a Backstage Component entity). The payload is
        validated against the Backstage descriptor format (name/namespace/tag/label/annotation
        grammars, entity-reference syntax for `owner`/`system`/`subcomponentOf` and the four
        reference arrays); references are checked for FORMAT only — resolution against other
        stored files is a future feature. Entity identity (namespace + name, case-insensitive)
        must be unique among active files; a clash is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogFileRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new catalog-file resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFileResponse'
        '400':
          description: Payload violates the descriptor-format rules
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/catalog-files/cross-check:
    get:
      tags: [catalog-files]
      operationId: crossCheckCatalogFiles
      summary: Cross-check every stored file's entity references
      description: |
        Resolves every entity reference the active files make (`owner`, `system`,
        `subcomponentOf`, `providesApis`, `consumesApis`, `dependsOn`, `dependencyOf`) against
        the workspace and reports three tiers of findings:

        - `MISSING` (error) — the reference should resolve to a stored Component (explicit
          `component:` kind, or a field whose default kind is component) but no active file
          matches. Namespaceless references resolve within the REFERENCING file's own
          namespace; matching is case-insensitive throughout.
        - `KIND_REQUIRED` (error) — a `dependsOn`/`dependencyOf` entry without a kind; those
          fields have no default kind, so Backstage itself cannot ingest such a reference.
        - `UNVERIFIABLE` (info) — the target kind is not stored in Toadie yet (group, user,
          api, system, domain, …); becomes checkable as further kinds are added.

        Findings never block saving — files legitimately reference entities that arrive later.
      responses:
        '200':
          description: The workspace report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossCheckReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/catalog-files/check:
    post:
      tags: [catalog-files]
      operationId: checkCatalogFile
      summary: Check one document's references against the stored files
      description: |
        The editor's live companion to the workspace cross-check: takes one (possibly unsaved,
        possibly not-yet-valid) document and returns its reference findings against the stored
        identities — same three-tier semantics as the workspace report. The document is
        sanitized but deliberately NOT validated (in-progress documents are legal here;
        unparsable references are skipped — the form flags them itself). A pure computation:
        nothing is stored; POST only because the document travels in the body. Note an unsaved
        file is not in the identity set, so its self-references read as missing until first
        save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogFileRequest'
      responses:
        '200':
          description: The document's findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCheckReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/catalog-files/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [catalog-files]
      operationId: getCatalogFile
      summary: Fetch a catalog file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFileResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [catalog-files]
      operationId: replaceCatalogFile
      summary: Replace a catalog file
      description: |
        Full replacement; same validation as create. Renaming into an identity an active file
        already holds is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogFileRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: Payload violates the descriptor-format rules
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [catalog-files]
      operationId: deleteCatalogFile
      summary: Delete a catalog file
      description: Soft delete — the file leaves every list and read, and its identity is freed.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400.
      schema: { type: integer, format: int32, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail) or, on
        /login, the per-account lockout is active (account-specific detail). Both carry a
        ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    CatalogFileRequest:
      type: object
      description: >-
        One catalog-info.yaml document — a Backstage Component entity. `kind` is implicit
        (`Component`) until further kinds arrive.
      required: [metadata, spec]
      properties:
        metadata: { $ref: '#/components/schemas/CatalogFileMetadata' }
        spec: { $ref: '#/components/schemas/ComponentSpec' }

    CatalogFileMetadata:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[A-Za-z0-9]+([-_.][A-Za-z0-9]+)*$'
          description: >-
            Entity name — unique (case-insensitively) per namespace among active files.
        namespace:
          type: string
          maxLength: 63
          default: default
          description: Folded to lowercase; blank/omitted means `default`.
        title:
          type: string
          maxLength: 200
          nullable: true
          description: Display-only alternative to `name`; no format restrictions.
        description:
          type: string
          maxLength: 2000
          nullable: true
        labels:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 63 }
          description: >-
            Kubernetes-style identifying key/value pairs. Keys are an optional lowercase-domain
            prefix (max 253 chars) plus `/` plus a name part; values follow the entity-name
            grammar.
        annotations:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 5000 }
          description: >-
            Non-identifying key/value pairs (key grammar as labels; values free-form). Keys the
            catalog server writes itself (`backstage.io/managed-by-location`,
            `backstage.io/managed-by-origin-location`, `backstage.io/orphan`) are rejected.
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 63
            pattern: '^[a-z0-9:+#]+(-[a-z0-9:+#]+)*$'
        links:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CatalogLink' }

    CatalogLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Absolute URI.
        title:
          type: string
          maxLength: 100
          nullable: true
        icon:
          type: string
          maxLength: 63
          nullable: true
          description: Semantic icon key (entity-name grammar).

    ComponentSpec:
      type: object
      required: [type, lifecycle, owner]
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 63
          description: Component classification, e.g. `service`, `website`, `library`.
        lifecycle:
          type: string
          minLength: 1
          maxLength: 63
          description: Lifecycle state, e.g. `experimental`, `production`, `deprecated`.
        owner:
          type: string
          description: >-
            Entity reference `[kind:][namespace/]name` of the owning group/user (format-checked
            only; resolution is a future feature).
        system:
          type: string
          nullable: true
          description: Entity reference of the parent System.
        subcomponentOf:
          type: string
          nullable: true
          description: Entity reference of the parent Component.
        providesApis:
          type: array
          maxItems: 100
          items: { type: string }
          description: Entity references of provided APIs.
        consumesApis:
          type: array
          maxItems: 100
          items: { type: string }
          description: Entity references of consumed APIs.
        dependsOn:
          type: array
          maxItems: 100
          items: { type: string }
          description: Entity references of Components/Resources this component depends on.
        dependencyOf:
          type: array
          maxItems: 100
          items: { type: string }
          description: Entity references of Components/Resources depending on this component.

    CatalogFileResponse:
      type: object
      required: [id, metadata, spec, createdBy, creatorName, creatorDeleted, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        metadata: { $ref: '#/components/schemas/CatalogFileMetadata' }
        spec: { $ref: '#/components/schemas/ComponentSpec' }
        createdBy: { type: integer, format: int32, minimum: 0 }
        creatorName: { type: string }
        creatorDeleted:
          type: boolean
          description: True when the creating user has been soft-deleted.
        createdAt: { type: integer, format: int64, description: Epoch milliseconds. }
        updatedAt: { type: integer, format: int64, description: Epoch milliseconds. }

    CatalogFileListItem:
      type: object
      required: [id, name, namespace, title, type, lifecycle, owner, creatorName, creatorDeleted, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        namespace: { type: string }
        title: { type: string, nullable: true }
        type: { type: string }
        lifecycle: { type: string }
        owner: { type: string }
        creatorName: { type: string }
        creatorDeleted:
          type: boolean
          description: True when the creating user has been soft-deleted.
        updatedAt: { type: integer, format: int64, description: Epoch milliseconds. }

    CrossCheckStatus:
      type: string
      enum: [MISSING, KIND_REQUIRED, UNVERIFIABLE]
      description: >-
        MISSING and KIND_REQUIRED are errors; UNVERIFIABLE is informational (the target kind
        is not stored in Toadie yet).

    CrossCheckFinding:
      type: object
      required: [fileId, fileName, fileNamespace, field, reference, status]
      properties:
        fileId: { type: integer, format: int32, minimum: 0 }
        fileName: { type: string }
        fileNamespace: { type: string }
        field:
          type: string
          description: The spec field holding the reference, e.g. `spec.dependsOn`.
        reference: { type: string }
        status: { $ref: '#/components/schemas/CrossCheckStatus' }

    CrossCheckReport:
      type: object
      required: [findings, checkedFiles, checkedReferences]
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/CrossCheckFinding'
        checkedFiles: { type: integer, minimum: 0 }
        checkedReferences:
          type: integer
          minimum: 0
          description: Non-blank references encountered across all checked files.

    DocumentCheckFinding:
      type: object
      required: [field, reference, status]
      properties:
        field:
          type: string
          description: The spec field holding the reference, e.g. `spec.dependsOn`.
        reference: { type: string }
        status: { $ref: '#/components/schemas/CrossCheckStatus' }

    DocumentCheckReport:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/DocumentCheckFinding'

    CatalogFilePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFileListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
