openapi: 3.1.0
info:
  title: toadie-api
  version: 1.0.0
  description: |
    JWT-authenticated REST API for Toadie — a Backstage `catalog-info.yaml` helper.
    Exposes the authentication surface, admin-managed user accounts, and the catalog-file
    workspace: CRUD across the seven landscape kinds, the Errors report and live
    document check, the relationship graph, the structured export/import round-trip, and
    the SSRF-guarded URL fetch.

    Authorization model: every user is implicitly a regular user; additional global roles
    (`ADMIN`) are carried as the `roles` array and only ever ADD privileges on top of that
    baseline. `ADMIN` is the management role and owns the whole `/users` surface; catalog
    content is a shared workspace where ADMIN gets no special access.

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`).
    Any endpoint may additionally return `500` (`InternalServerError`) on an
    unexpected server fault.
servers:
  - url: http://localhost:8081
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: catalog-files
  - name: dictionaries
  - name: labels
  - name: tag-categories
  - name: entity-types
  - name: annotation-keys
  - name: lenses

paths:
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Challenges are single-use, expire after
        a short TTL (default 5 min, `MFA_CODE_TTL_SECONDS`), and allow a few attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted, user gone — answers the uniform `401`. Rate-limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal. Accepts a valid, unexpired, non-revoked refresh token and
        returns a brand-new access token and refresh token (each with a full TTL). The presented
        refresh token is left valid until its own expiry — it is not rotated out. Requires no
        `Authorization` header (the access token may already be expired). Returns `401` for a
        missing/invalid/expired/revoked refresh token, if the user no longer exists, or if the
        token was minted before the user's most recent password change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Always answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a new password is generated, its hash replaces the old one (which stops
        working, and all outstanding refresh tokens are invalidated), and the password is sent
        to the account's email address. Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. A soft-deleted account is unknown
        here (no password is minted, no email sent; the `202` stays uniform). Answers `503` on
        deployments without outbound email (`MAIL_TRANSPORT=disabled`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: |
        ADMIN only — the whole management surface is admin-gated; regular users keep only
        their self password change.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email` (deliberately not `roles` — a set has no
          order). Default sort is `id` ascending; `id` ascending is always appended as a
          deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` / `email` — case- and accent-insensitive substring matches.
          - `role` — `ADMIN` (holders of the additional role) or `USER` (plain users).
          - `feature` + `featureEnabled` — feature-flag state (the pair must come
            together, `400` otherwise; `featureEnabled` is a strict boolean).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: email
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. The initial password is CLIENT-generated (the SPA's 96-bit generator) and
        shown to the admin exactly once — the server stores only the bcrypt hash and no
        response ever carries plaintext. The email is canonicalized (trimmed + lowercased);
        a duplicate among active accounts is a `409` (a soft-deleted account frees its email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: Target user or ADMIN (guard-before-read — an unauthorized caller 403s uniformly).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: |
        ADMIN only. The password is deliberately not writable here (it has its own endpoint).
        Demoting the LAST active administrator is a `409` — the management surface must stay
        reachable. An email already used by another active account is also a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        ADMIN only, soft delete: the account can no longer sign in, outstanding refresh
        tokens die (`user_gone`), the email is freed for reuse, and the user's catalog files
        stay with a deleted-creator marker. Deleting YOURSELF is a `403`; deleting the LAST
        active administrator is a `409`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (idempotent, a same-set re-PUT is `204` again).
        **ADMIN-only**; changing one's OWN flags is allowed (the users routes themselves are
        never feature-gated, so an admin can always find their way back). `MFA` is the one
        inverted-default flag: users start with it in the disabled set, and a set omitting it
        — the empty "re-enable everything" array included — ENABLES the login second factor.
        The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: |
        The ONE synced per-user language: it drives the UI at sign-in (rides `LoginResponse`,
        applied by the SPA on login/MFA/refresh) and the language of every email sent to the
        user (read fresh at send time, so a change takes effect immediately for emails; the
        UI picks it up at the next sign-in or token refresh). **Target user or ADMIN** — the
        header language switcher is the self-service writer (switching while signed in also
        saves here); an admin may fix a mis-set language. Idempotent (a same-value re-PUT is
        `204` again); an unsupported code is `400`. Audited as `user.language_changed` on an
        actual change. Set initially at create (`UserCreateRequest.language`, default `en`);
        the whole-user PUT deliberately never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/graph-layout:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUserGraphLayout
      summary: Read a user's Graph-page layout (target user or ADMIN)
      description: |
        The per-user Graph layout document: the layout mode (`auto` = dagre computed on
        every render, `manual` = the dragged positions apply) plus every manually dragged
        node's canvas position, keyed by node id (`kind:namespace/name`). A user who never
        saved gets the default (`auto`, no positions) — never a 404 for a live target.
        **Target user or ADMIN**, guard-before-read (a forbidden caller gets a uniform 403
        whether or not the id exists).
      responses:
        '200':
          description: The stored (or default) layout document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphLayoutDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: setUserGraphLayout
      summary: Replace a user's Graph-page layout (target user or ADMIN)
      description: |
        A **wholesale replace** of the whole layout document — the client merges (it holds
        the full positions map from the GET and updates only dragged entries), so a PUT
        carrying only the currently visible nodes' positions would silently drop the rest.
        Written by the Graph page on every mode switch, drag stop (debounced), and layout
        reset. Idempotent; **target user or ADMIN**. Deliberately unaudited (pure
        high-frequency view state); denials still emit `authz.denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphLayoutDocument'
      responses:
        '204': { description: Layout replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files:
    get:
      tags: [catalog-files]
      operationId: listCatalogFiles
      summary: List stored catalog files
      description: |
        Lists the stored catalog-info.yaml files (shared workspace — every authenticated user
        sees every file).

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `kind`, `name`, `namespace`, `updatedAt`, `lastSyncedAt`
          (0 = never synced, so ascending surfaces the most-stale files first). Default sort
          is `id` ascending; `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (optional, whitelisted; the shared catalog-file filter set — the graph
          endpoint declares the same one): `name`, `namespace`, `kind`, `tag`, `type`,
          `lifecycle`, `owner`, `label` + `labelValue` — see each parameter's description.

        Each returned item includes the creator's `creatorName` resolved via join so the UI
        does not need an N+1 lookup.

        Malformed query parameters (unknown sort field, out-of-range page/pageSize, repeated
        scalar keys) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/CatalogNameFilter'
        - $ref: '#/components/parameters/CatalogNamespaceFilter'
        - $ref: '#/components/parameters/CatalogKindFilter'
        - $ref: '#/components/parameters/CatalogTagFilter'
        - $ref: '#/components/parameters/CatalogTypeFilter'
        - $ref: '#/components/parameters/CatalogLifecycleFilter'
        - $ref: '#/components/parameters/CatalogOwnerFilter'
        - $ref: '#/components/parameters/CatalogLabelFilter'
        - $ref: '#/components/parameters/CatalogLabelValueFilter'
      responses:
        '200':
          description: A page of catalog files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFilePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [catalog-files]
      operationId: createCatalogFile
      summary: Create a catalog file
      description: |
        Stores a new catalog-info.yaml document — a Backstage entity of any of the seven
        landscape kinds (Component, API, System, Domain, Resource, Group, User). The payload
        is validated against the Backstage descriptor format (name/namespace/tag/label/
        annotation grammars, entity-reference syntax, the per-kind required/forbidden field
        tables). The namespace must additionally be an active
        entry of the `namespaces` dictionary, every label must be an ADMIN-registered
        label allowed for the file's kind with a value from its closed list, every
        annotation KEY must be an ADMIN-registered annotation key allowed for the file's
        kind (values stay free), every tag
        must belong to an ADMIN-defined tag category allowed for the file's kind, a
        non-blank `spec.type` must be in the file's kind's ADMIN-defined type dictionary,
        a non-blank `spec.lifecycle` must be an active entry of the `lifecycles`
        dictionary, and every
        entity reference must RESOLVE to a stored active entity of a kind the field allows
        (e.g. `spec.owner` → Group or User; namespaceless references resolve within the
        file's own namespace, matching is case-insensitive) and must NOT reference the
        entity itself — all strict by default, no grandfathering,
        else `400` (all soft-check violations aggregate into one detail).
        `allowInvalid=true` WAIVES the soft checks (reference resolution and the five
        registry rules) and stores the document anyway — the Errors report tracks the
        waived findings; the structural rules and namespace resolution stay hard `400`s.
        Entity identity (kind + namespace + name, case-insensitive) must be unique among
        active files; a clash is a `409`.

        The optional `sourceUrl` sets the file's source reference (the https URL of its
        repo copy — static guards only: absolute https, no credentials, at most 2048
        characters, else `400`). A file created this way is NOT synced yet (`lastSyncedAt`
        stays 0) — only a sync or a fetch-from-URL import stamps the sync state.
      parameters:
        - $ref: '#/components/parameters/AllowInvalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogFileWriteRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new catalog-file resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFileResponse'
        '400':
          description: Payload violates the descriptor-format rules
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/errors:
    get:
      tags: [catalog-files]
      operationId: getCatalogFileErrors
      summary: Every error in the stored files — references, registries, structure, namespaces
      description: |
        The workspace Errors report. Resolves every entity reference the active files make
        (`owner`, `system`, `subcomponentOf`, `providesApis`, `consumesApis`, `dependsOn`,
        `dependencyOf`) against the workspace:

        - `MISSING` — no active file matches the referenced identity (explicit or via
          the field's default kind). Namespaceless references resolve within the REFERENCING
          file's own namespace; matching is case-insensitive throughout.
        - `KIND_REQUIRED` — a `dependsOn`/`dependencyOf` entry without a kind; those
          fields have no default kind, so Backstage itself cannot ingest such a reference.
        - `WRONG_KIND` — the reference names a kind the field does not allow (e.g. a
          Component in `spec.owner`, which accepts only Group or User).
        - `SELF_REFERENCE` — the reference resolves to the referencing file itself
          (e.g. a Domain's `spec.subdomainOf` naming that very Domain); a Toadie rule beyond
          upstream Backstage.

        …checks every file's labels, annotation keys, tags, `spec.type`,
        and `spec.lifecycle` against the ADMIN-curated registries (`LABEL_NOT_ALLOWED`,
        `ANNOTATION_NOT_ALLOWED`, `TAG_NOT_ALLOWED`, `TYPE_NOT_ALLOWED`,
        `LIFECYCLE_NOT_ALLOWED`). Saves enforce all of these by default but may waive them
        with `allowInvalid=true` (import always does), so findings here arise from waived
        saves, DELETIONS (dangling references are allowed to appear that way), registry rows
        removed after the fact, import batches whose sibling documents failed, and legacy
        self-references stored before the rule existed. Every finding blocks the file's next
        STRICT save (a waived save still goes through).

        …and additionally runs the report-only checks over the STORED rows:

        - `STRUCTURE_INVALID` — the structural descriptor validation no longer accepts the
          stored document (a legacy row); the finding's `message` carries the validator's
          own text. Validation is fail-fast, so a file reports its FIRST structural problem
          only. (HARD on every write — a finding means the row predates a rule change.)
        - `NAMESPACE_NOT_ALLOWED` — the stored `metadata.namespace` is no longer an active
          `namespaces` dictionary entry (removed after the save; the rule is HARD on writes).
        - `SOURCE_MISSING` — the file carries no source reference (the URL of its repo
          copy). The reference is OPTIONAL on every write — set it in the editor or import
          from a URL — but a file without one cannot be synced, so the report keeps it
          visible (finding `field` is `source`, `reference` empty).

        The optional filters (the SAME whitelisted set as the list and graph endpoints,
        same semantics) narrow which files' errors are REPORTED — `checkedFiles`/
        `checkedReferences` count the reported set; references still resolve against the
        whole workspace, so filtering never manufactures `MISSING` findings. Unpaged by
        design — a report-style computation over the workspace.
      parameters:
        - $ref: '#/components/parameters/CatalogNameFilter'
        - $ref: '#/components/parameters/CatalogNamespaceFilter'
        - $ref: '#/components/parameters/CatalogKindFilter'
        - $ref: '#/components/parameters/CatalogTagFilter'
        - $ref: '#/components/parameters/CatalogTypeFilter'
        - $ref: '#/components/parameters/CatalogLifecycleFilter'
        - $ref: '#/components/parameters/CatalogOwnerFilter'
        - $ref: '#/components/parameters/CatalogLabelFilter'
        - $ref: '#/components/parameters/CatalogLabelValueFilter'
      responses:
        '200':
          description: The workspace errors report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/check:
    post:
      tags: [catalog-files]
      operationId: checkCatalogFile
      summary: Check one document against the stored files and the registries
      description: |
        The editor's live companion to the workspace Errors report: takes one (possibly unsaved,
        possibly not-yet-valid) document and returns its soft findings — reference resolution
        against the stored identities plus the registry checks (labels, annotation keys, tags,
        type, lifecycle) — with the same statuses as the workspace report. Every finding here
        means a STRICT save would be rejected (the editor offers `allowInvalid` as the
        save-anyway waiver). The document is sanitized but deliberately NOT validated
        (in-progress documents are legal here; unparsable references are skipped — the form
        flags them itself). A pure computation: nothing is stored; POST only because the
        document travels in the body. A reference to the document's OWN identity is
        `SELF_REFERENCE` — saved or not, an entity may never reference itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogFileRequest'
      responses:
        '200':
          description: The document's findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCheckReport'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/graph:
    get:
      tags: [catalog-files]
      operationId: getCatalogGraph
      summary: The stored files rendered together as a relationship graph
      description: |
        Every active file and the reference edges between them, resolved with the Errors report's
        semantics (per-field default kinds, namespaceless references resolve in the referencing
        file's own namespace, case-insensitive identity). Node statuses:

        - `STORED` — an active catalog file (carries `fileId`).
        - `MISSING` — a referenced entity of a stored kind that no active file provides (the
          Errors report's MISSING, drawn).
        - `EXTERNAL` — a referenced entity of a kind Toadie doesn't store (Location, Template,
          custom kinds).

        Kind-less `dependsOn`/`dependencyOf` entries (report findings) are not drawable and
        are omitted. The optional filters (the SAME whitelisted set as the list endpoint, same
        semantics) narrow which files' references are EXPANDED; targets still resolve against
        the whole workspace, so a stored file outside the filter appears as a STORED node when
        something points at it. Unpaged by design — a report-style computation over the
        workspace.
      parameters:
        - $ref: '#/components/parameters/CatalogNameFilter'
        - $ref: '#/components/parameters/CatalogNamespaceFilter'
        - $ref: '#/components/parameters/CatalogKindFilter'
        - $ref: '#/components/parameters/CatalogTagFilter'
        - $ref: '#/components/parameters/CatalogTypeFilter'
        - $ref: '#/components/parameters/CatalogLifecycleFilter'
        - $ref: '#/components/parameters/CatalogOwnerFilter'
        - $ref: '#/components/parameters/CatalogLabelFilter'
        - $ref: '#/components/parameters/CatalogLabelValueFilter'
      responses:
        '200':
          description: The graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogGraph'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/export:
    get:
      tags: [catalog-files]
      operationId: exportCatalogFiles
      summary: Export the workspace as structured catalog documents
      description: |
        Every active file as a structured document (the same shape create/replace accept),
        ordered by (namespace, name) case-insensitively so the export is deterministic. YAML
        rendering is deliberately a client concern — the SPA joins these documents into one
        multi-document `catalog-info.yaml` with its tested generator. Unpaged by design — a
        report-style read of the whole workspace.
      parameters:
        - name: namespace
          in: query
          required: false
          schema: { type: string }
          description: Exact (case-insensitive) namespace of the files to export.
      responses:
        '200':
          description: The workspace's documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/import:
    post:
      tags: [catalog-files]
      operationId: importCatalogFiles
      summary: Import a batch of catalog documents (report & skip)
      description: |
        Imports up to 200 structured documents (the SPA parses `catalog-info.yaml` client-side
        and ships the parsed documents here). Each document imports INDEPENDENTLY and gets its
        own result row: `CREATED` (stored clean, `fileId` set), `CREATED_WITH_FINDINGS`
        (stored DESPITE soft findings — import always waives reference resolution and the
        registry rules so a flawed batch can land and be fixed incrementally; `fileId` set,
        `message` lists the findings, the Errors report tracks them), `INVALID` (failed
        the structural descriptor-format validation or namespace resolution, `message` names
        the rule; sibling documents in the SAME batch count as resolution targets, order
        independent), `CONFLICT` (an active file
        already holds the kind+namespace+name identity — nothing is overwritten), or `ERROR`
        (an unexpected storage failure). The response is `200` even when every document failed
        — the result rows are the outcome; a `400` covers only the batch itself (an
        undecodable body, more than 200 entries, or an invalid `sourceUrl`).

        With `sourceUrl` set (the fetch-from-URL flow), every STORED row gets it as its
        source reference and starts synced — an import from a repo URL IS a sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: One result per submitted document, in order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/import/check:
    post:
      tags: [catalog-files]
      operationId: checkCatalogImport
      summary: Dry-run an import batch (nothing is stored)
      description: |
        The import's dry-run: runs the IDENTICAL per-document classification — structural
        validation, namespace resolution, identity conflicts against the workspace AND
        within the batch, soft findings — and returns the same result rows, storing
        nothing. Statuses read as PREDICTIONS: `CREATED` = would be created, `CREATED_WITH_
        FINDINGS` = would be created carrying the listed findings; `fileId` is always null.
        A pure computation: nothing is stored, nothing is audited; POST only because the
        batch travels in the body. The report is a snapshot — a concurrent write between
        the check and the real import can change the actual outcome. The same `400` covers
        only the batch itself (an undecodable body or more than 200 entries).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: One predicted result per submitted document, in order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/fetch:
    post:
      tags: [catalog-files]
      operationId: fetchCatalogUrl
      summary: Fetch a catalog-info.yaml from a URL (server-side)
      description: |
        Retrieves the raw text at the given URL so the SPA can drop it into the import flow —
        server-side so any reachable host works, not only CORS-friendly ones. YAML parsing
        stays a client concern; this returns TEXT.

        SSRF posture: the URL must be an absolute `https` address without credentials whose
        host resolves ONLY to public addresses — anything else (http, userinfo, loopback,
        private/link-local/unique-local ranges, unresolvable hosts) is a uniform `400` that
        never echoes what was probed. Redirects are not followed (`502` — use the final URL),
        the response body is capped at 1 MB, and upstream failures (non-200, timeout,
        oversize) answer `502`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchUrlRequest'
      responses:
        '200':
          description: The raw text at the URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchUrlResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [catalog-files]
      operationId: getCatalogFile
      summary: Fetch a catalog file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFileResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [catalog-files]
      operationId: replaceCatalogFile
      summary: Replace a catalog file
      description: |
        Full replacement; same validation as create (the defined-namespace,
        registered-label, registered-annotation-key, registered-tag, registered-type,
        registered-lifecycle, and resolved-reference rules included — strict by default: a
        file whose label, annotation key, tag, type, or lifecycle was removed from its
        registry, or whose referenced entity was deleted, cannot be saved until it is fixed;
        a reference to the file's own identity is a `400`). `allowInvalid=true` waives those
        soft checks exactly as on create (the namespace rule stays hard). Renaming into an
        identity an active file already holds is a `409`.

        `sourceUrl` follows full-replace semantics: an omitted/blank value CLEARS the stored
        source reference, and any change (set, clear, different URL) resets the sync state
        (`lastSyncedAt` back to 0, the baseline dropped). `updatedAt` bumps only on an
        actual DOCUMENT change — a reference-only edit never reads as "modified in the DB
        since the sync".
      parameters:
        - $ref: '#/components/parameters/AllowInvalid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogFileWriteRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: Payload violates the descriptor-format rules
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [catalog-files]
      operationId: deleteCatalogFile
      summary: Delete a catalog file
      description: Soft delete — the file leaves every list and read, and its identity is freed.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/files/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [catalog-files]
      operationId: getCatalogFileSyncState
      summary: Read a catalog file's sync state
      description: |
        The file's source reference, last-sync stamp, and the BASELINE document stored at the
        last sync — what the sync modal compares the current DB document and the freshly
        fetched repo copy against to attribute changes to a side. A never-synced file answers
        `lastSyncedAt: 0` with a null baseline. Any authenticated user (the shared-workspace
        rule); a pure read, not audited.
      responses:
        '200':
          description: The sync state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [catalog-files]
      operationId: syncCatalogFile
      summary: Overwrite the file with its repo copy (repo→DB sync)
      description: |
        The repo→DB sync: overwrites the stored document with the submitted one — the repo
        copy the client fetched via `POST /files/fetch` and parsed from YAML (YAML stays a
        client concern) — and stamps the sync state (`lastSyncedAt` = `updatedAt` = now, the
        submitted document becomes the new baseline).

        Soft findings (reference resolution, the registry rules) are ALWAYS waived — the
        import posture: the repo is the source of truth and the Errors report is the net.
        Structural validation and namespace resolution stay HARD (`400`). The file must hold
        a source reference (`400` otherwise — set one first). A repo-side rename landing on
        an identity another active file holds is a `409`. Confirmation is a client concern
        (the sync modal); DB→repo sync deliberately does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCatalogFileRequest'
      responses:
        '204': { description: Synced — the DB copy now equals the submitted repo copy }
        '400':
          description: >-
            Payload violates the descriptor-format rules, the namespace is not an active
            dictionary entry, or the file has no source reference.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/dictionaries/{dictionary}:
    parameters:
      - name: dictionary
        in: path
        required: true
        schema:
          type: string
          enum: [namespaces, lifecycles]
        description: >-
          The dictionary's URL slug: `namespaces` (the allowed catalog-file namespaces,
          with the DEFAULT entry blank namespaces resolve to) or `lifecycles` (the GLOBAL
          allowed `spec.lifecycle` values — no default entry).
    get:
      tags: [dictionaries]
      operationId: getDictionary
      summary: Read a dictionary's entries
      description: |
        Any authenticated user. Returns the active entries in the admin-curated order —
        deliberately unpaged (a dictionary holds at most 200 entries by validation), NOT a
        standard list endpoint. Each dictionary is an allowlist every catalog-file write is
        validated against: `namespaces` for `metadata.namespace`, `lifecycles` for
        `spec.lifecycle`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [dictionaries]
      operationId: replaceDictionary
      summary: Replace a dictionary's entries
      description: |
        ADMIN only — a whole-document replace; the payload's array order becomes the stored
        order (there is no reorder endpoint). An item carrying an `id` renames/repositions
        that active entry in place (rename keeps identity); an id-less item inserts; an
        active entry missing from the payload is soft-deleted. Values are trimmed and folded
        to lowercase, and must satisfy the shared value grammar (lowercase alphanumerics
        with single dashes). The default flag branches per dictionary: a non-empty
        `namespaces` document must mark EXACTLY one item `isDefault` (what blank
        catalog-file namespaces resolve to), while `lifecycles` has no default — any
        flagged item there is a `400`.
        Swapping two values in one save is a `409` (the value uniqueness index) — rename
        through a temporary value in two saves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictionaryUpdateRequest'
      responses:
        '204': { description: Replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/labels:
    get:
      tags: [labels]
      operationId: listLabels
      summary: List the label registry
      description: |
        Any authenticated user. Returns every active label, key-ordered case-insensitively —
        deliberately unpaged (the registry holds at most 200 labels by validation), NOT a
        standard list endpoint. The registry is the whitelist every catalog-file write's
        `metadata.labels` is validated against.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [labels]
      operationId: createLabel
      summary: Register a label
      description: |
        ADMIN only. Registers a new allowed `metadata.labels` key with its CLOSED value list
        and the entity kinds it may be applied to. The key follows the descriptor-format
        label-key grammar; each value follows the entity-name grammar; kinds must be among
        the seven landscape kinds (normalized to canonical casing and order). A key already
        held by an active label (case-insensitively) is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new label resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/labels/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [labels]
      operationId: replaceLabel
      summary: Replace a label
      description: |
        ADMIN only — whole-label replacement (key rename included: stored files carrying the
        old key simply fail the strict check on their next save). Same validation as create;
        renaming onto a key an active label already holds is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
      responses:
        '204': { description: Replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [labels]
      operationId: deleteLabel
      summary: Delete a label
      description: |
        ADMIN only — soft delete; the key becomes reusable by a NEW label. Stored files
        carrying the deleted label fail the strict check on their next save until it is
        re-registered or removed from the file.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/tag-categories:
    get:
      tags: [tag-categories]
      operationId: listTagCategories
      summary: List the tag categories
      description: |
        Any authenticated user. Returns every active tag category, name-ordered
        case-insensitively — deliberately unpaged (the registry holds at most 200 categories
        by validation), NOT a standard list endpoint. Categories are an internal Toadie
        concept (not in the Backstage schema): the registry is the whitelist every
        catalog-file write's `metadata.tags` is validated against.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCategoryList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [tag-categories]
      operationId: createTagCategory
      summary: Create a tag category
      description: |
        ADMIN only. Registers a category: an internal display name, its allowed tags (each
        following the descriptor-format tag grammar), and the entity kinds those tags may be
        applied to (normalized to canonical casing and order). A name already held by an
        active category (case-insensitively), or a tag already belonging to ANOTHER active
        category (each tag belongs to exactly one), is a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCategoryRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new tag-category resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCategory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/tag-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [tag-categories]
      operationId: replaceTagCategory
      summary: Replace a tag category
      description: |
        ADMIN only — whole-category replacement (rename included: stored files carrying a
        removed tag simply fail the strict check on their next save). Same validation and
        `409` rules as create; moving a tag between categories is remove-then-add in TWO
        saves (adding it while another active category still holds it is the `409`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCategoryRequest'
      responses:
        '204': { description: Replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [tag-categories]
      operationId: deleteTagCategory
      summary: Delete a tag category
      description: |
        ADMIN only — soft delete; the name (and every tag it held) becomes reusable by a NEW
        category. Stored files carrying its tags fail the strict check on their next save
        until the tags are re-registered or removed from the file.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/entity-types:
    get:
      tags: [entity-types]
      operationId: listEntityTypes
      summary: List the per-kind type dictionaries
      description: |
        Any authenticated user. Returns every active per-kind type dictionary, kind-ordered
        alphabetically — deliberately unpaged (at most six rows: one per type-bearing kind),
        NOT a standard list endpoint. The dictionaries are an internal Toadie constraint on
        the open `spec.type` field (not part of the Backstage schema): each kind's dictionary
        is the whitelist every catalog-file write's `spec.type` is validated against, and the
        dictionaries are INDEPENDENT of one another (the same value may be allowed for
        several kinds).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypesList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [entity-types]
      operationId: createEntityTypes
      summary: Create a kind's type dictionary
      description: |
        ADMIN only. Defines the allowed `spec.type` values for one type-bearing kind
        (Component, API, System, Domain, Resource, or Group — User's spec has no type).
        A kind already holding an active dictionary is a `409`; kinds with no dictionary
        allow NO types (for required-type kinds that blocks saving files of that kind).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityTypesRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new entity-types resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypes'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/entity-types/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [entity-types]
      operationId: replaceEntityTypes
      summary: Replace a kind's type dictionary
      description: |
        ADMIN only — whole-dictionary replacement, kind change included (moving the list to
        a kind that already has an active dictionary is a `409`). Stored files carrying a
        removed type simply fail the strict check on their next save (no grandfathering).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityTypesRequest'
      responses:
        '204': { description: Replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [entity-types]
      operationId: deleteEntityTypes
      summary: Delete a kind's type dictionary
      description: |
        ADMIN only — soft delete; the kind becomes definable again by a NEW dictionary.
        Until then the kind allows NO types, so files of a required-type kind cannot be
        saved (a deliberate admin choice — the strict no-grandfathering rule).
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/annotation-keys:
    get:
      tags: [annotation-keys]
      operationId: listAnnotationKeys
      summary: List the annotation-key registry
      description: |
        Any authenticated user. Returns every active annotation key, ordered
        case-insensitively — deliberately unpaged (the registry holds at most 200 keys by
        validation), NOT a standard list endpoint. The registry is the whitelist every
        catalog-file write's `metadata.annotations` KEYS are validated against; annotation
        VALUES stay free strings.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationKeyList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [annotation-keys]
      operationId: createAnnotationKey
      summary: Register an annotation key
      description: |
        ADMIN only. Registers one allowed `metadata.annotations` key (the descriptor-format
        key grammar) with the entity kinds it may be applied to (normalized to canonical
        casing and order). A key already held by an active row (case-insensitively) is a
        `409`; the keys the catalog server writes itself cannot be registered (`400`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationKeyRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new annotation-key resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationKey'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/annotation-keys/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [annotation-keys]
      operationId: replaceAnnotationKey
      summary: Replace an annotation key
      description: |
        ADMIN only — whole-row replacement, key rename included (stored files carrying the
        old key simply fail the strict check on their next save). Same validation and `409`
        rules as create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationKeyRequest'
      responses:
        '204': { description: Replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [annotation-keys]
      operationId: deleteAnnotationKey
      summary: Delete an annotation key
      description: |
        ADMIN only — soft delete; the key becomes reusable by a NEW registration. Stored
        files carrying it fail the strict check on their next save until it is re-registered
        or removed from them.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/lenses:
    get:
      tags: [lenses]
      operationId: listLenses
      summary: List the lenses visible to the caller
      description: |
        Any authenticated user. Returns every active lens the caller may see: their OWN
        lenses (both visibilities) plus everyone's PUBLIC ones — name-ordered
        case-insensitively, deliberately unpaged (a personal-plus-curated scale). A lens is
        a named snapshot of the shared catalog filter set the Hierarchy/Files/Graph/Errors
        views declare; PRIVATE lenses never appear in anyone else's list (admins included —
        ADMIN gets no special content access).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LensList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [lenses]
      operationId: createLens
      summary: Save a lens
      description: |
        Any authenticated user; the caller becomes the creator. The filter payload is
        validated STRUCTURALLY only (lengths, the kind whitelist, `labelValue` requires
        `label`), never against the registries — a lens holding a since-removed value simply
        matches nothing. A name already held by one of the caller's own active lenses
        (case-insensitively) is a `409`; different users may reuse a name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LensRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new lens resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/lenses/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [lenses]
      operationId: replaceLens
      summary: Replace a lens
      description: |
        Creator only — whole-lens replacement: overwrite (save-again), rename, and the
        visibility flip are all this one operation. A foreign PRIVATE (or unknown) lens id
        is a uniform `404` — a private lens's existence is itself private — while a foreign
        PUBLIC lens (visible in everyone's list anyway) is an honest `403`; admins get the
        same treatment. Same validation and `409` rules as create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LensRequest'
      responses:
        '204': { description: Replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [lenses]
      operationId: deleteLens
      summary: Delete a lens
      description: |
        Creator only — soft delete; the name becomes reusable by a NEW lens of the same
        owner. The same disclosure split as replace: foreign PRIVATE/unknown → `404`,
        foreign PUBLIC → `403`.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400.
      schema: { type: integer, format: int32, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    AllowInvalid:
      name: allowInvalid
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: |
        Waive the SOFT checks (reference resolution and the label / annotation-key / tag /
        type / lifecycle registry rules) and store the document despite their findings —
        the explicit save-anyway opt-in. The structural descriptor-format rules and
        namespace resolution stay hard `400`s regardless. Waived findings surface on the
        workspace Errors report and block the file's next strict save.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    # The shared catalog-file filter set — declared identically by the list and graph
    # endpoints (the list applies it in SQL, the graph in memory; one semantics).
    CatalogNameFilter:
      name: name
      in: query
      required: false
      schema: { type: string }
      description: Case- and accent-insensitive substring match against the entity name.
    CatalogNamespaceFilter:
      name: namespace
      in: query
      required: false
      schema: { type: string }
      description: Exact (case-insensitive) namespace match.
    CatalogKindFilter:
      name: kind
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
      description: >-
        Any-of (IN) match over the supported kinds (case-insensitive) — repetition is the
        documented IN idiom on this parameter. An unknown value is a 400.
    CatalogTagFilter:
      name: tag
      in: query
      required: false
      schema: { type: string }
      description: >-
        Exact membership match against the file's metadata.tags entries
        (case-insensitive; tags are stored lowercase).
    CatalogTypeFilter:
      name: type
      in: query
      required: false
      schema: { type: string }
      description: >-
        Case-insensitive exact match against spec.type. An open match — values are not
        validated against the type registry (waived/imported files may carry unregistered
        types), and there is no interplay with the kind filter.
    CatalogLifecycleFilter:
      name: lifecycle
      in: query
      required: false
      schema: { type: string }
      description: >-
        Case-insensitive exact match against spec.lifecycle. An open match — values are not
        validated against the lifecycles dictionary.
    CatalogOwnerFilter:
      name: owner
      in: query
      required: false
      schema: { type: string }
      description: >-
        An entity reference (`[kind:][namespace/]name`; defaults kind `group`, namespace
        `default`) naming the owner to filter by. A file matches when its stored spec.owner —
        whatever short form it uses — RESOLVES to that entity under the descriptor defaulting
        rules (default kind group, default namespace = the file's own namespace),
        case-insensitively. An unparsable reference is a 400.
    CatalogLabelFilter:
      name: label
      in: query
      required: false
      schema: { type: string }
      description: >-
        A metadata.labels KEY that must be present on the file. Byte-exact key match (the
        label registry forbids case-twin keys). Combine with labelValue to also constrain the
        key's value.
    CatalogLabelValueFilter:
      name: labelValue
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
      style: form
      explode: true
      description: >-
        Any-of (IN) match over the selected label's value, case-insensitive — the one
        parameter where repetition is the documented IN idiom (API-LIST-004). Requires the
        label parameter (labelValue without label is a 400).

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail) or, on
        /login, the per-account lockout is active (account-specific detail). Both carry a
        ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint (declared here on the largest-bodied operation; field-level maxLength
        rules reject oversized values far earlier on ordinary payloads).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadGateway:
      description: >-
        The upstream request made on the caller's behalf failed (the remote answered non-200,
        redirected, timed out, or exceeded the size cap).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V18) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    GraphPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
          description: React Flow canvas x coordinate (top-left of the node).
        y:
          type: number
          format: double
          description: React Flow canvas y coordinate (top-left of the node).

    GraphLayoutDocument:
      type: object
      description: >-
        The per-user Graph-page layout (V19): the mode plus every manually dragged node's
        position, keyed by node id (kind:namespace/name). The PUT replaces it wholesale;
        both fields default (auto / empty) when omitted.
      properties:
        mode:
          type: string
          enum: [auto, manual]
          default: auto
          description: >-
            auto = the dagre layout computed on every render; manual = the stored dragged
            positions apply (nodes without a stored position keep their dagre spot).
        positions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GraphPosition'
          description: >-
            Dragged node positions by node id — at most 1000 entries, keys non-blank and
            at most 400 characters.

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    CatalogFileRequest:
      type: object
      description: >-
        One catalog-info.yaml document — a Backstage entity of one of the supported landscape
        kinds. `spec` is one flat superset of every kind's fields; the server enforces the
        per-kind required/forbidden rules (a field foreign to the kind is a 400 naming it).
      required: [metadata, spec]
      properties:
        kind: { $ref: '#/components/schemas/EntityKind' }
        metadata: { $ref: '#/components/schemas/CatalogFileMetadata' }
        spec: { $ref: '#/components/schemas/EntitySpec' }

    CatalogFileWriteRequest:
      type: object
      description: >-
        The create/replace body: the Backstage document plus the OPTIONAL source file
        reference. The document half is stored and exported PURE — the reference is envelope
        state (never part of the document or the export/import round trip).
      required: [metadata, spec]
      properties:
        kind: { $ref: '#/components/schemas/EntityKind' }
        metadata: { $ref: '#/components/schemas/CatalogFileMetadata' }
        spec: { $ref: '#/components/schemas/EntitySpec' }
        sourceUrl:
          type: string
          maxLength: 2048
          nullable: true
          description: >-
            The https URL of the file's canonical copy in a GitLab/GitHub repo. Static
            guards only (absolute https, no credentials, at most 2048 characters) — the
            public-host check runs at fetch time. On PUT, full-replace semantics: omitted or
            blank CLEARS the stored reference; any change resets the sync state.
          example: https://github.com/acme/service/blob/main/catalog-info.yaml

    EntityKind:
      type: string
      enum: [Component, API, System, Domain, Resource, Group, User]
      default: Component
      description: >-
        The canonical kind casing. The server accepts case-variant input and canonicalizes it
        on write; responses always carry the canonical form listed here.

    FetchUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: >-
            Absolute https URL of a catalog-info.yaml, without credentials, resolving to a
            public host.
          example: https://raw.githubusercontent.com/acme/service/main/catalog-info.yaml

    FetchUrlResponse:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: The raw text at the URL (at most 1 MB), ready for the import parser.

    ExportResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          description: The active documents, ordered by (namespace, name) case-insensitively.
          items: { $ref: '#/components/schemas/CatalogFileRequest' }

    ImportRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          maxItems: 200
          description: The documents to import, each handled independently (report & skip).
          items: { $ref: '#/components/schemas/CatalogFileRequest' }
        sourceUrl:
          type: string
          maxLength: 2048
          nullable: true
          description: >-
            The URL the batch was fetched from (the import page's fetch-from-URL flow) —
            every stored row gets it as its source reference AND starts synced (the content
            IS the repo copy at import time). Omit for pasted/uploaded batches. One URL for
            the whole request: a multi-document catalog-info.yaml is ONE repo file. Same
            static guards as a write's `sourceUrl` (absolute https, no credentials), else
            the whole batch is a `400`.

    ImportResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One result per submitted document, in submission order.
          items: { $ref: '#/components/schemas/ImportFileResult' }

    ImportFileResult:
      type: object
      required: [index, kind, namespace, name, status]
      properties:
        index:
          type: integer
          minimum: 0
          description: The document's 0-based position in the submitted batch.
        kind:
          type: string
          description: The document's (sanitized) kind — canonical-cased when recognized.
        namespace:
          type: string
          description: The sanitized namespace (lowercased; blank became `default`).
        name:
          type: string
          description: The sanitized entity name.
        status:
          type: string
          enum: [CREATED, CREATED_WITH_FINDINGS, INVALID, CONFLICT, ERROR]
          description: >-
            CREATED — stored clean (`fileId` set). CREATED_WITH_FINDINGS — stored despite
            soft findings, which import always waives (`fileId` set, `message` lists the
            findings; the Errors report tracks them). INVALID — failed the structural
            descriptor-format validation or namespace resolution (`message` names the rule).
            CONFLICT — an active file already holds this identity; nothing was overwritten.
            ERROR — an unexpected storage failure for this document.
        fileId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The new file's id, only when the document was stored (always null on the
            dry-run's predicted rows).
        message:
          type: string
          nullable: true
          description: The failure or finding detail, absent on CREATED.

    CatalogFileMetadata:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[A-Za-z0-9]+([-_.][A-Za-z0-9]+)*$'
          description: >-
            Entity name — unique (case-insensitively) per namespace among active files.
        namespace:
          type: string
          maxLength: 63
          description: >-
            Folded to lowercase; blank/omitted resolves to the dictionary entry flagged as
            the DEFAULT at write time (none flagged → `400`). A concrete value must be an
            active entry of the `namespaces` dictionary
            (`GET /api/v1/dictionaries/namespaces`) — undefined namespaces are rejected
            with `400`.
        title:
          type: string
          maxLength: 200
          nullable: true
          description: Display-only alternative to `name`; no format restrictions.
        description:
          type: string
          maxLength: 2000
          nullable: true
        labels:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 63 }
          description: >-
            Kubernetes-style identifying key/value pairs. Keys are an optional lowercase-domain
            prefix (max 253 chars) plus `/` plus a name part; values follow the entity-name
            grammar. On every write, each key must additionally be an ADMIN-registered label
            (`GET /api/v1/labels`) allowed for the file's kind, with the value from that
            label's closed list (strict — no grandfathering); violations are rejected with
            `400`.
        annotations:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 5000 }
          description: >-
            Non-identifying key/value pairs (key grammar as labels; values free-form). Keys the
            catalog server writes itself (`backstage.io/managed-by-location`,
            `backstage.io/managed-by-origin-location`, `backstage.io/orphan`) are rejected.
            On every write, each key must additionally be an ADMIN-registered annotation key
            (`GET /api/v1/annotation-keys`) allowed for the file's kind — unregistered keys
            are rejected with `400`; values are not registry-checked.
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 63
            pattern: '^[a-z0-9:+#]+(-[a-z0-9:+#]+)*$'
          description: >-
            On every write, each tag must additionally belong to an ADMIN-defined tag
            category (`GET /api/v1/tag-categories`) whose kinds include the file's kind
            (strict — no grandfathering); violations are rejected with `400`.
        links:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/CatalogLink' }

    CatalogLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Absolute URI.
        title:
          type: string
          maxLength: 100
          nullable: true
        icon:
          type: string
          maxLength: 63
          nullable: true
          description: Semantic icon key (entity-name grammar).

    EntitySpec:
      type: object
      description: >-
        The superset of every supported kind's spec fields — required/forbidden per kind:
        Component needs type/lifecycle/owner; API additionally definition; System and Domain
        need owner; Resource type/owner; Group type plus a PRESENT children list (may be
        empty); User a PRESENT memberOf list. Fields foreign to the document's kind are
        rejected.
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 63
          nullable: true
          description: >-
            Classification, e.g. `service` (Component), `openapi` (API), `team` (Group). On
            every write a non-blank value must be in the file's kind's type dictionary
            (`GET /api/v1/entity-types`) — unregistered types are rejected with `400`.
        lifecycle:
          type: string
          minLength: 1
          maxLength: 63
          nullable: true
          description: >-
            Lifecycle state, e.g. `experimental`, `production`, `deprecated`. On every write
            a non-blank value must be an active entry of the `lifecycles` dictionary
            (`GET /api/v1/dictionaries/lifecycles`) — unregistered lifecycles are rejected
            with `400`.
        owner:
          type: string
          nullable: true
          description: >-
            Entity reference `[kind:][namespace/]name` of the owning group/user (format-checked
            here; resolution is the Errors report's job).
        system:
          type: string
          nullable: true
          description: Entity reference of the parent System.
        subcomponentOf:
          type: string
          nullable: true
          description: Entity reference of the parent Component.
        providesApis:
          type: array
          maxItems: 100
          items: { type: string }
          description: Entity references of provided APIs.
        consumesApis:
          type: array
          maxItems: 100
          items: { type: string }
          description: Entity references of consumed APIs.
        dependsOn:
          type: array
          maxItems: 100
          items: { type: string }
          description: Entity references of Components/Resources this component depends on.
        dependencyOf:
          type: array
          maxItems: 100
          items: { type: string }
          description: Entity references of Components/Resources depending on this component.
        definition:
          type: string
          maxLength: 100000
          nullable: true
          description: The API definition document itself (OpenAPI/AsyncAPI/GraphQL/gRPC…). API kind only, required there.
        profile:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EntityProfile'
        parent:
          type: string
          nullable: true
          description: Entity reference of the parent Group (Group kind).
        children:
          type: array
          maxItems: 100
          items: { type: string }
          nullable: true
          description: Immediate child Groups — REQUIRED (possibly empty) for Group.
        members:
          type: array
          maxItems: 100
          items: { type: string }
          description: User references in this group (Group kind).
        memberOf:
          type: array
          maxItems: 100
          items: { type: string }
          nullable: true
          description: Group references — REQUIRED (possibly empty) for User.
        domain:
          type: string
          nullable: true
          description: Entity reference of the parent Domain (System kind).
        subdomainOf:
          type: string
          nullable: true
          description: Entity reference of the parent Domain (Domain kind).

    EntityProfile:
      type: object
      description: Display profile for Group/User entities.
      properties:
        displayName: { type: string, maxLength: 200, nullable: true }
        email: { type: string, maxLength: 254, nullable: true }
        picture:
          type: string
          nullable: true
          description: Absolute URI of a representative image.

    CatalogFileResponse:
      type: object
      required: [id, kind, metadata, spec, createdBy, creatorName, creatorDeleted, createdAt, updatedAt, sourceUrl, lastSyncedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        kind: { $ref: '#/components/schemas/EntityKind' }
        metadata: { $ref: '#/components/schemas/CatalogFileMetadata' }
        spec: { $ref: '#/components/schemas/EntitySpec' }
        createdBy: { type: integer, format: int32, minimum: 0 }
        creatorName: { type: string }
        creatorDeleted:
          type: boolean
          description: True when the creating user has been soft-deleted.
        createdAt: { type: integer, format: int64, description: Epoch milliseconds. }
        updatedAt: { type: integer, format: int64, description: Epoch milliseconds. }
        sourceUrl:
          type: string
          nullable: true
          description: The file's source reference (its repo copy's URL); null = none set.
        lastSyncedAt:
          type: integer
          format: int64
          description: >-
            Epoch millis of the last repo→DB sync; 0 = never. A sync stamps `updatedAt`
            equal, so `updatedAt > lastSyncedAt` means "modified in the DB since the sync".

    CatalogFileListItem:
      type: object
      required: [id, kind, name, namespace, title, type, lifecycle, owner, tags, creatorName, creatorDeleted, updatedAt, sourceUrl, lastSyncedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        kind: { $ref: '#/components/schemas/EntityKind' }
        name: { type: string }
        namespace: { type: string }
        title: { type: string, nullable: true }
        type: { type: string, nullable: true }
        lifecycle: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        creatorName: { type: string }
        creatorDeleted:
          type: boolean
          description: True when the creating user has been soft-deleted.
        updatedAt: { type: integer, format: int64, description: Epoch milliseconds. }
        sourceUrl:
          type: string
          nullable: true
          description: The file's source reference (its repo copy's URL); null = none set.
        lastSyncedAt:
          type: integer
          format: int64
          description: >-
            Epoch millis of the last repo→DB sync; 0 = never. A sync stamps `updatedAt`
            equal, so `updatedAt > lastSyncedAt` means "modified in the DB since the sync".

    SyncStateResponse:
      type: object
      required: [sourceUrl, lastSyncedAt, syncedDocument]
      properties:
        sourceUrl:
          type: string
          nullable: true
          description: The file's source reference; null = none set (syncing is refused).
        lastSyncedAt:
          type: integer
          format: int64
          description: Epoch millis of the last repo→DB sync; 0 = never.
        syncedDocument:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CatalogFileRequest'
          description: >-
            The document as stored at the last sync — the baseline the client compares the
            current DB document and the fetched repo copy against; null = never synced.

    SyncCatalogFileRequest:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/CatalogFileRequest'

    ErrorStatus:
      type: string
      enum:
        - MISSING
        - KIND_REQUIRED
        - WRONG_KIND
        - SELF_REFERENCE
        - LABEL_NOT_ALLOWED
        - ANNOTATION_NOT_ALLOWED
        - TAG_NOT_ALLOWED
        - TYPE_NOT_ALLOWED
        - LIFECYCLE_NOT_ALLOWED
        - STRUCTURE_INVALID
        - NAMESPACE_NOT_ALLOWED
        - SOURCE_MISSING
      description: >-
        References: MISSING (no stored entity matches), KIND_REQUIRED
        (a kind-less dependsOn/dependencyOf entry), WRONG_KIND (the reference names a kind
        the field does not allow), SELF_REFERENCE (the reference resolves to the referencing
        file itself). Registries: LABEL_NOT_ALLOWED / ANNOTATION_NOT_ALLOWED /
        TAG_NOT_ALLOWED / TYPE_NOT_ALLOWED / LIFECYCLE_NOT_ALLOWED (the value is not
        allowed by its ADMIN-curated registry for the file's kind; the finding's `reference`
        carries the offending value). Those nine are SOFT: they block the document's next
        STRICT save but a save may waive them with `allowInvalid=true`. The last three are
        report-only verdicts over STORED rows, never emitted by the ad-hoc check:
        STRUCTURE_INVALID (the descriptor validation no longer accepts the stored document —
        a legacy row; the rule stays HARD on writes), NAMESPACE_NOT_ALLOWED (the stored
        namespace was removed from the `namespaces` dictionary after the save; HARD on
        writes too), and SOURCE_MISSING (the file carries no source reference — OPTIONAL on
        writes, so never a save blocker, just a standing report entry).

    ErrorFinding:
      type: object
      required: [fileId, fileKind, fileName, fileNamespace, field, reference, status]
      properties:
        fileId: { type: integer, format: int32, minimum: 0 }
        fileKind: { type: string }
        fileName: { type: string }
        fileNamespace: { type: string }
        field:
          type: string
          description: >-
            The field the error lives in, e.g. `spec.dependsOn` (`document` for
            STRUCTURE_INVALID findings, which concern the whole document; `source` for
            SOURCE_MISSING, which concerns the file's envelope).
        reference:
          type: string
          description: >-
            The offending reference or value (empty for STRUCTURE_INVALID — the `message`
            carries the specifics — and for SOURCE_MISSING, where absence IS the finding).
        status: { $ref: '#/components/schemas/ErrorStatus' }
        message:
          type: string
          nullable: true
          description: >-
            The validator's own text — set on STRUCTURE_INVALID findings only; null
            everywhere else (the status alone identifies the rule).

    ErrorsReport:
      type: object
      required: [findings, checkedFiles, checkedReferences]
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ErrorFinding'
        checkedFiles:
          type: integer
          minimum: 0
          description: Files in the reported (filter-narrowed) set.
        checkedReferences:
          type: integer
          minimum: 0
          description: Non-blank references encountered across the reported files.

    DocumentCheckFinding:
      type: object
      required: [field, reference, status]
      properties:
        field:
          type: string
          description: The spec field holding the reference, e.g. `spec.dependsOn`.
        reference: { type: string }
        status: { $ref: '#/components/schemas/ErrorStatus' }

    DocumentCheckReport:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items:
            $ref: '#/components/schemas/DocumentCheckFinding'

    GraphNodeStatus:
      type: string
      enum: [STORED, MISSING, EXTERNAL]

    GraphNode:
      type: object
      required: [id, kind, namespace, name, status]
      properties:
        id:
          type: string
          description: Canonical lowercased identity `kind:namespace/name` (the dedupe key).
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        title: { type: string, nullable: true }
        fileId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The backing file for STORED nodes; null for virtual nodes.
        status: { $ref: '#/components/schemas/GraphNodeStatus' }

    GraphEdge:
      type: object
      required: [sourceId, targetId, field]
      properties:
        sourceId: { type: string }
        targetId: { type: string }
        field:
          type: string
          description: The spec field the reference lives in, e.g. `spec.dependsOn`.

    CatalogGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'

    CatalogFilePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFileListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DictionaryEntry:
      type: object
      required: [id, value, isDefault]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
        value:
          type: string
          maxLength: 63
          description: Stored lowercase-folded (the namespace grammar).
        isDefault:
          type: boolean
          description: >-
            Exactly one entry per (non-empty) dictionary carries this — for `namespaces` it
            is what a blank/omitted catalog-file namespace resolves to.

    DictionaryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryEntry'
          description: Active entries in the admin-curated order.

    DictionaryEntryInput:
      type: object
      required: [value]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Present = update that active entry in place; absent = insert a new one.
        value:
          type: string
          maxLength: 63
          description: Trimmed and folded to lowercase before validation and storage.
        isDefault:
          type: boolean
          default: false
          description: >-
            A non-empty document must flag EXACTLY one item (zero or several is a `400`).

    DictionaryUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DictionaryEntryInput'
          description: The full replacement document — array order becomes the stored order.

    Label:
      type: object
      required: [id, key, values, kinds]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
        key:
          type: string
          maxLength: 317
          description: >-
            The allowed `metadata.labels` key — an optional lowercase-domain prefix (max 253
            chars) plus `/` plus a name part. Unique case-insensitively among active labels.
        values:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 63 }
          description: The CLOSED value list, in the admin's order.
        kinds:
          type: array
          maxItems: 7
          items: { type: string, maxLength: 63 }
          description: >-
            The entity kinds the label may be applied to, in canonical casing and order.

    LabelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Label'
          description: Active labels, key-ordered case-insensitively.

    LabelRequest:
      type: object
      required: [key, values, kinds]
      properties:
        key:
          type: string
          maxLength: 317
          description: Trimmed; the descriptor-format label-key grammar.
        values:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, maxLength: 63 }
          description: >-
            At least one entry; each trimmed and validated against the entity-name grammar;
            no case-folded duplicates. Array order becomes the stored order.
        kinds:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: string, maxLength: 63 }
          description: >-
            At least one of the seven landscape kinds (case-insensitive input; stored in
            canonical casing and order); no duplicates.

    LensVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]
      description: >-
        PRIVATE lenses are visible only to their creator; PUBLIC lenses are visible to every
        authenticated user. Both stay creator-only mutable.

    LensFilters:
      type: object
      description: >-
        The shared catalog filter set as a saved snapshot — the same nine slots the
        files/graph/errors GETs accept as query parameters. Every field is optional; absent
        means "not filtered on". Values are validated structurally only, never against the
        registries.
      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
          description: Case- and accent-insensitive name substring.
        namespace:
          type: string
          nullable: true
          maxLength: 255
        kind:
          type: array
          nullable: true
          maxItems: 7
          items: { type: string, maxLength: 63 }
          description: >-
            The visible-kinds set (any-of, canonical casing and order); absent = every kind
            visible.
        tag:
          type: string
          nullable: true
          maxLength: 255
        type:
          type: string
          nullable: true
          maxLength: 255
        lifecycle:
          type: string
          nullable: true
          maxLength: 255
        owner:
          type: string
          nullable: true
          maxLength: 255
          description: An entity reference, matched by reference resolution.
        label:
          type: string
          nullable: true
          maxLength: 255
        labelValue:
          type: array
          nullable: true
          maxItems: 100
          items: { type: string, maxLength: 255 }
          description: Any-of over the selected label's values; requires `label`.

    Lens:
      type: object
      required: [id, name, visibility, filters, createdBy, creatorName, creatorDeleted, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
        name:
          type: string
          maxLength: 100
          description: Unique case-insensitively among the CREATOR'S active lenses.
        visibility:
          $ref: '#/components/schemas/LensVisibility'
        filters:
          $ref: '#/components/schemas/LensFilters'
        createdBy:
          type: integer
          format: int32
          minimum: 0
          description: The creator's user id — the only user who may replace or delete the lens.
        creatorName:
          type: string
          description: The creator's display name (from the users table at read time).
        creatorDeleted:
          type: boolean
          description: True when the creator's account has since been soft-deleted.
        createdAt:
          type: integer
          format: int64
          description: Epoch millis.
        updatedAt:
          type: integer
          format: int64
          description: Epoch millis.

    LensList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lens'
          description: Visible lenses, name-ordered case-insensitively.

    LensRequest:
      type: object
      required: [name, visibility, filters]
      properties:
        name:
          type: string
          maxLength: 100
          description: Trimmed; must not be blank.
        visibility:
          $ref: '#/components/schemas/LensVisibility'
        filters:
          $ref: '#/components/schemas/LensFilters'

    TagCategory:
      type: object
      required: [id, name, tags, kinds]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
        name:
          type: string
          maxLength: 63
          description: >-
            Internal display name (categories are a Toadie concept, not part of the
            Backstage schema). Unique case-insensitively among active categories.
        tags:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 63 }
          description: >-
            The category's tags (descriptor tag grammar), in the admin's order. Each tag
            belongs to exactly ONE category.
        kinds:
          type: array
          maxItems: 7
          items: { type: string, maxLength: 63 }
          description: >-
            The entity kinds the category's tags may be applied to, in canonical casing
            and order.

    TagCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TagCategory'
          description: Active categories, name-ordered case-insensitively.

    TagCategoryRequest:
      type: object
      required: [name, tags, kinds]
      properties:
        name:
          type: string
          maxLength: 63
          description: Trimmed; 1–63 characters, no control characters.
        tags:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, maxLength: 63 }
          description: >-
            At least one entry; each trimmed and validated against the tag grammar
            (`[a-z0-9:+#]` runs with single dash separators); no duplicates. A tag held by
            ANOTHER active category is a `409`. Array order becomes the stored order.
        kinds:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: string, maxLength: 63 }
          description: >-
            At least one of the seven landscape kinds (case-insensitive input; stored in
            canonical casing and order); no duplicates.

    EntityTypes:
      type: object
      required: [id, kind, types]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
        kind:
          type: string
          maxLength: 63
          description: >-
            The type-bearing kind this dictionary constrains (canonical casing). Unique
            among active dictionaries — one dictionary per kind.
        types:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 63 }
          description: >-
            The kind's allowed `spec.type` values (the spec.type grammar — single word, no
            whitespace), in the admin's order. Dictionaries are independent: the same value
            may appear under several kinds.

    EntityTypesList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityTypes'
          description: Active per-kind dictionaries, kind-ordered alphabetically.

    EntityTypesRequest:
      type: object
      required: [kind, types]
      properties:
        kind:
          type: string
          maxLength: 63
          description: >-
            One of the type-bearing kinds — Component, API, System, Domain, Resource, Group
            (case-insensitive input; stored canonical). User is rejected: its spec has no
            type field. A kind already holding an active dictionary is a `409`.
        types:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, maxLength: 63 }
          description: >-
            At least one entry; each trimmed and validated with the exact `spec.type` rule
            (1–63 characters, no whitespace); no case-folded duplicates. Array order becomes
            the stored order.

    AnnotationKey:
      type: object
      required: [id, key, kinds]
      properties:
        id:
          type: integer
          format: int32
          minimum: 0
        key:
          type: string
          maxLength: 317
          description: >-
            The allowed `metadata.annotations` key (descriptor key grammar — optional
            lowercase-domain prefix + `/` + name part). Unique case-insensitively among
            active rows. Values are not constrained by the registry.
        kinds:
          type: array
          maxItems: 7
          items: { type: string, maxLength: 63 }
          description: >-
            The entity kinds the key may be applied to, in canonical casing and order.

    AnnotationKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationKey'
          description: Active annotation keys, ordered case-insensitively.

    AnnotationKeyRequest:
      type: object
      required: [key, kinds]
      properties:
        key:
          type: string
          maxLength: 317
          description: >-
            Trimmed; the descriptor key grammar. The keys the catalog server writes itself
            are rejected. A key held by another active row (case-insensitively) is a `409`.
        kinds:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: string, maxLength: 63 }
          description: >-
            At least one of the seven landscape kinds (case-insensitive input; stored in
            canonical casing and order); no duplicates.

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
