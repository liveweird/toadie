name: ci

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Compare against the target before this change, never against the checked-out merge.
      # A first branch push has an all-zero before SHA; the checker uses origin/master then. The
      # "Resolve the GraphQL baseline" step below hands the build the value it may actually use.
      GRAPHQL_BASELINE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: gradle
      # A force-pushed branch's push event names a before SHA that no ref reaches any more, so even a
      # full-history checkout lacks it: compare such a push against its merge-base with origin/master
      # (what it branched from, so a branch behind master is not charged with master's additions).
      # Only push events fall back; an unresolvable PR or merge-group base still fails the checker.
      - name: Resolve the GraphQL baseline
        id: baseline
        run: |
          revision="$GRAPHQL_BASELINE_REVISION"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git cat-file -e "${revision}^{commit}" 2>/dev/null; then
            revision="$(git merge-base origin/master HEAD)"
            echo "::notice::Push baseline '${GRAPHQL_BASELINE_REVISION}' is unreachable (force-push); comparing against merge-base ${revision}."
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
      # Strict: a missing or mismatched artifact checksum fails the build instead of warning.
      # installDist is what the Docker image build runs, so its resolution is verified here too.
      - name: Build, test, static analysis, and coverage
        env:
          GRAPHQL_BASELINE_REVISION: ${{ steps.baseline.outputs.revision }}
        run: ./gradlew build :server:koverXmlReport :server:installDist --dependency-verification strict --no-daemon
      # A tripwire, not the proof: a plain build never writes locks or checksums, so this fires only
      # if a step above (or a future --write-* flag) rewrote them. The proof is the strict build.
      - name: Tripwire - lockfiles and verification metadata are untouched by the build
        run: git diff --exit-code -- gradle/verification-metadata.xml gradle.lockfile settings-gradle.lockfile buildscript-gradle.lockfile core/gradle.lockfile core/buildscript-gradle.lockfile server/gradle.lockfile server/buildscript-gradle.lockfile
      - name: Upload backend reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            server/build/reports/
            server/build/test-results/
            core/build/reports/
          retention-days: 7

  frontend:
    name: Frontend and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # --legacy-peer-deps is required here: openapi-typescript declares TS ^5 as a peer while
      # web/ uses TS 6 (see CLAUDE.md's web/ install command); e2e/'s plain `npm ci` has no such
      # conflict, so that workflow deliberately omits the flag.
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Check API contract and generated types
        working-directory: web
        run: npm run lint:api && npm run check:api
      - name: Build, lint, dead code, and coverage
        working-directory: web
        run: npm run build && npm run lint && npm run knip && npm run test:coverage
      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage/
          retention-days: 7

  gradle-vulnerability-scan:
    # Scan the resolved project and plugin classpaths (the committed lockfiles), build and test
    # dependencies included. A flagged module gets a version floor, never a gate exception
    # (.claude/docs/testing.md "Gradle advisory scan").
    name: Gradle advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan Gradle lockfiles
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-locks/core" "$RUNNER_TEMP/gradle-locks/server" "$RUNNER_TEMP/trivy-cache"
          cp gradle.lockfile settings-gradle.lockfile buildscript-gradle.lockfile "$RUNNER_TEMP/gradle-locks/"
          cp core/gradle.lockfile core/buildscript-gradle.lockfile "$RUNNER_TEMP/gradle-locks/core/"
          cp server/gradle.lockfile server/buildscript-gradle.lockfile "$RUNNER_TEMP/gradle-locks/server/"
          docker run --rm \
            -v "$RUNNER_TEMP/gradle-locks:/scan:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/cache" \
            -v "$RUNNER_TEMP:/out" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --include-dev-deps --format json \
            --output /out/gradle-vulnerabilities.json --cache-dir /cache --no-progress /scan
          python3 - <<'PY'
          import collections
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "gradle-vulnerabilities.json")) as report:
              results = json.load(report).get("Results") or []
          # Trivy matches lockfiles by name; one it stops recognising would silently leave the
          # scan, so every copied lockfile must appear as a target (with or without findings).
          expected = {
              "gradle.lockfile", "settings-gradle.lockfile", "buildscript-gradle.lockfile",
              "core/gradle.lockfile", "core/buildscript-gradle.lockfile",
              "server/gradle.lockfile", "server/buildscript-gradle.lockfile",
          }
          scanned = {result["Target"] for result in results}
          print("Scanned lockfiles:", ", ".join(sorted(scanned)))
          if expected - scanned:
              raise SystemExit(f"Lockfiles missing from the scan: {sorted(expected - scanned)}")
          found = [
              (vulnerability["Severity"], vulnerability["VulnerabilityID"], vulnerability["PkgName"],
               vulnerability["InstalledVersion"], result["Target"])
              for result in results
              for vulnerability in result.get("Vulnerabilities") or []
          ]
          print("Gradle dependency advisories:", dict(collections.Counter(row[0] for row in found)))
          for row in sorted(set(found)):
              print("  " + " ".join(row))
          if any(row[0] in ("HIGH", "CRITICAL") for row in found):
              raise SystemExit("HIGH or CRITICAL Gradle dependency advisory")
          PY
      - name: Upload advisory report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-vulnerabilities
          path: ${{ runner.temp }}/gradle-vulnerabilities.json
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Browser journeys
    uses: ./.github/workflows/e2e.yml

  quality-gate:
    # Require this ONE stable status in the repository ruleset. No path filters: a skipped
    # dependency must never turn a required check green or leave a documentation PR pending.
    name: Quality gate
    if: ${{ always() }}
    needs: [backend, frontend, gradle-vulnerability-scan, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          GRADLE_SCAN: ${{ needs.gradle-vulnerability-scan.result }}
          E2E: ${{ needs.e2e.result }}
        run: test "$BACKEND" = success && test "$FRONTEND" = success && test "$GRADLE_SCAN" = success && test "$E2E" = success
