name: ci

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Compare against the target before this change, never against the checked-out merge.
      # A first branch push has an all-zero before SHA; the checker uses origin/master then.
      GRAPHQL_BASELINE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: gradle
      # Strict: a missing or mismatched artifact checksum fails the build instead of warning.
      - name: Build, test, static analysis, and coverage
        run: ./gradlew build :server:koverXmlReport --dependency-verification strict --no-daemon
      # Locks and checksums must already be what the build resolves (CLAUDE.md "Dependency locking").
      - name: Confirm lockfiles and verification metadata match the committed graph
        run: git diff --exit-code -- gradle/verification-metadata.xml gradle.lockfile settings-gradle.lockfile buildscript-gradle.lockfile core/gradle.lockfile server/gradle.lockfile
      - name: Upload backend reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            server/build/reports/
            server/build/test-results/
            core/build/reports/
          retention-days: 7

  frontend:
    name: Frontend and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # --legacy-peer-deps is required here: openapi-typescript declares TS ^5 as a peer while
      # web/ uses TS 6 (see CLAUDE.md's web/ install command); e2e/'s plain `npm ci` has no such
      # conflict, so that workflow deliberately omits the flag.
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Check API contract and generated types
        working-directory: web
        run: npm run lint:api && npm run check:api
      - name: Build, lint, dead code, and coverage
        working-directory: web
        run: npm run build && npm run lint && npm run knip && npm run test:coverage
      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage/
          retention-days: 7

  gradle-vulnerability-scan:
    # Scan the resolved project and plugin classpaths (the committed lockfiles), build and test
    # dependencies included. A flagged module gets a version floor, never a gate exception
    # (.claude/docs/testing.md "Gradle advisory scan").
    name: Gradle advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan Gradle lockfiles
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-locks/core" "$RUNNER_TEMP/gradle-locks/server" "$RUNNER_TEMP/trivy-cache"
          cp gradle.lockfile settings-gradle.lockfile buildscript-gradle.lockfile "$RUNNER_TEMP/gradle-locks/"
          cp core/gradle.lockfile "$RUNNER_TEMP/gradle-locks/core/"
          cp server/gradle.lockfile "$RUNNER_TEMP/gradle-locks/server/"
          docker run --rm \
            -v "$RUNNER_TEMP/gradle-locks:/scan:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/cache" \
            -v "$RUNNER_TEMP:/out" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --include-dev-deps --format json \
            --output /out/gradle-vulnerabilities.json --cache-dir /cache --no-progress /scan
          python3 - <<'PY'
          import collections
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "gradle-vulnerabilities.json")) as report:
              results = json.load(report)["Results"]
          counts = collections.Counter(
              vulnerability["Severity"]
              for result in results
              for vulnerability in result.get("Vulnerabilities") or []
          )
          print("Gradle dependency advisories:", dict(counts))
          if counts["CRITICAL"] or counts["HIGH"]:
              raise SystemExit("HIGH or CRITICAL Gradle dependency advisory")
          PY
      - name: Upload advisory report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-vulnerabilities
          path: ${{ runner.temp }}/gradle-vulnerabilities.json
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Browser journeys
    uses: ./.github/workflows/e2e.yml

  quality-gate:
    # Require this ONE stable status in the repository ruleset. No path filters: a skipped
    # dependency must never turn a required check green or leave a documentation PR pending.
    name: Quality gate
    if: ${{ always() }}
    needs: [backend, frontend, gradle-vulnerability-scan, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          GRADLE_SCAN: ${{ needs.gradle-vulnerability-scan.result }}
          E2E: ${{ needs.e2e.result }}
        run: test "$BACKEND" = success && test "$FRONTEND" = success && test "$GRADLE_SCAN" = success && test "$E2E" = success
