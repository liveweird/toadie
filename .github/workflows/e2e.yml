name: e2e

# Blackbox Playwright suite: brings the full stack up via docker compose and drives a real browser.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A fresh hosted runner plus an explicit project owns this disposable database.
      # Never point this workflow at an existing workspace or a self-hosted Docker daemon.
      COMPOSE_PROJECT_NAME: toadie-ci
      E2E_BASE_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install e2e deps
        working-directory: e2e
        # No --legacy-peer-deps here: that flag is a web/-only workaround (openapi-typescript's
        # TS ^5 peer range vs. the SPA's TS 6, see CLAUDE.md); e2e/package.json has no such
        # conflict, so a plain install is the documented command for this workspace.
        run: npm ci

      - name: Check TypeScript and scenario parity
        working-directory: e2e
        run: npm run typecheck && npm run check:scenarios && npm run test:smoke

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Own the stack outside Playwright so failed setup still gets logs and cleanup.
      - name: Start isolated stack
        run: docker compose -p toadie-ci up -d --build

      - name: Wait for the API and mail catcher
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 3 http://localhost:8081/readyz &&
               curl --fail --silent --max-time 3 http://localhost:8026/api/v1/messages > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      # SCRATCH DIAGNOSTIC (pool stall attribution, 2026-09-20): every 3 s record the external
      # and in-container /readyz latency, established :8081 sockets, and container CPU/memory;
      # on an external stall (>5 s or failure) SIGQUIT the JVM so its thread dump lands in the
      # container log (stack.log), rate-limited to once per 20 s.
      - name: Start stall probe
        run: |
          nohup bash -c '
            last=0
            while true; do
              ts=$(date -u +%T)
              host=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 8 http://localhost:8081/readyz || echo "ERR 8")
              inner=$(docker exec toadie-app curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 4 http://localhost:8081/readyz 2>/dev/null || echo "ERR 4")
              est=$(ss -Htan state established "( sport = :8081 or dport = :8081 )" 2>/dev/null | wc -l | tr -d " ")
              stats=$(docker stats --no-stream --format "{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}" toadie-app toadie-postgres 2>/dev/null | tr "\n" " ")
              echo "$ts host=[$host] inner=[$inner] est8081=$est $stats"
              echo "  listeners: $(ss -Htlnp 2>/dev/null | grep ":8081" | awk "{print \$4}" | tr "\n" " ") published: $(docker port toadie-app 2>/dev/null | tr "\n" " ")"
              ss -Htanp 2>/dev/null | grep ":8081" | awk "{print \"  sock \" \$1, \$4, \$5, \$6}" | sort | uniq -c | sort -rn | head -40
              code=${host%% *}; secs=${host##* }
              stalled=$(awk -v c="$code" -v t="$secs" "BEGIN{print (c!=\"200\" || t+0>5) ? 1 : 0}")
              now=$(date +%s)
              if [ "$stalled" = 1 ] && [ $((now-last)) -ge 20 ]; then
                last=$now
                echo "$ts STALL -> SIGQUIT toadie-app; host ss:"; ss -tanp 2>/dev/null | grep ":8081" | head -30
                docker kill -s QUIT toadie-app >/dev/null 2>&1 || true
                docker exec toadie-app sh -c "echo tcp-rows=\$(cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | wc -l)" 2>/dev/null || true
              fi
              sleep 3
            done
          ' > e2e/stall-probe.log 2>&1 &
          echo $! > e2e/stall-probe.pid

      - name: Run E2E
        working-directory: e2e
        run: npx playwright test

      # Owns a second, uniquely named project/volume. Never seeds the browser or dev database.
      - name: Verify seeded GraphQL deployment
        working-directory: e2e
        run: npm run smoke:graphql -- compose

      - name: Stop stall probe
        if: ${{ always() }}
        run: |
          pkill -P "$(cat e2e/stall-probe.pid)" 2>/dev/null || true
          kill "$(cat e2e/stall-probe.pid)" 2>/dev/null || true
          tail -5 e2e/stall-probe.log || true

      - name: Collect stack diagnostics
        if: ${{ always() }}
        run: docker compose -p toadie-ci logs --no-color > e2e/stack.log

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/stack.log
            e2e/stall-probe.log
          retention-days: 7

      - name: Remove this runner's disposable stack and database
        if: ${{ always() }}
        run: docker compose -p toadie-ci down --volumes --remove-orphans
