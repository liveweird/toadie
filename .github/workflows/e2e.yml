name: e2e

# Blackbox Playwright suite: brings the full stack up via docker compose and drives a real browser.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Only a dispatch of this workflow is grouped per ref: a running one is never cancelled (each owns a fresh
# runner), and a newer dispatch replaces a pending one. Under workflow_call `github.workflow` names the caller,
# so a run called from ci.yml is grouped by its own run id and ci.yml's concurrency alone governs it: a group
# shared with the caller would wait on, or cancel, its own run.
concurrency:
  group: ${{ github.workflow == 'e2e' && format('e2e-dispatch-{0}', github.ref) || format('e2e-call-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A fresh hosted runner plus an explicit project owns this disposable database.
      # Never point this workflow at an existing workspace or a self-hosted Docker daemon.
      COMPOSE_PROJECT_NAME: toadie-ci
      E2E_BASE_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install e2e deps
        working-directory: e2e
        # No --legacy-peer-deps here: that flag is a web/-only workaround (openapi-typescript's
        # TS ^5 peer range vs. the SPA's TS 6, see CLAUDE.md); e2e/package.json has no such
        # conflict, so a plain install is the documented command for this workspace.
        run: npm ci

      - name: Check TypeScript and scenario parity
        working-directory: e2e
        run: npm run typecheck && npm run check:scenarios && npm run test:smoke

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Own the stack outside Playwright so failed setup still gets logs and cleanup. The SSO
      # overlay (e2e/compose.sso.yaml) adds the stub identity provider and turns SSO on; every
      # compose call below carries the same -f pair so the stub is started, logged and removed.
      - name: Start isolated stack
        run: docker compose -p toadie-ci -f docker-compose.yaml -f e2e/compose.sso.yaml up -d --build

      - name: Wait for the API, mail catcher and stub identity provider
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 3 http://localhost:8081/readyz &&
               curl --fail --silent --max-time 3 http://localhost:8026/api/v1/messages > /dev/null &&
               curl --fail --silent --max-time 3 http://localhost:18090/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run E2E
        working-directory: e2e
        run: npx playwright test

      # Owns a second, uniquely named project/volume. Never seeds the browser or dev database.
      - name: Verify seeded GraphQL deployment
        working-directory: e2e
        run: npm run smoke:graphql -- compose

      - name: Collect stack diagnostics
        if: ${{ always() }}
        run: docker compose -p toadie-ci -f docker-compose.yaml -f e2e/compose.sso.yaml logs --no-color > e2e/stack.log

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/stack.log
          retention-days: 7

      - name: Remove this runner's disposable stack and database
        if: ${{ always() }}
        run: docker compose -p toadie-ci -f docker-compose.yaml -f e2e/compose.sso.yaml down --volumes --remove-orphans
