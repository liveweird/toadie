# Dependency update policy (D4): Dependabot, not Renovate. Weekly, grouped minor/patch PRs
# per ecosystem so routine bumps land as one reviewable PR instead of a dozen; majors stay
# separate since they can carry breaking changes worth reviewing on their own. The docker
# ecosystem updates base-image tags; publishing the app's own release image by immutable
# digest is separate open work (BACKLOG.md). See web/CLAUDE.md and CLAUDE.md for the gates
# every bump must pass (lint/knip/coverage, detekt, lockfile regeneration).
#
# Temurin: the runtime JRE may sit on a same-update respin ahead of mise.toml, while the JDK stage
# must equal mise, so a Dependabot bump of the JDK stage to that respin goes red on the parity test
# until mise lists it. That is the intended signal (.claude/docs/dependency-reproducibility.md).
#
# `web/src/test/infrastructure.test.js` pins this file's existence and its five
# (directory, ecosystem) pairs — update that test in the same commit as any pair added here.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # TypeScript majors are held back: `openapi-typescript` (peer `typescript ^5.x`, tolerated on
    # 6.0 via `--legacy-peer-deps`) drives the compiler-factory API that TypeScript 7.0 removed —
    # `npm run check:api` crashes on `createKeywordTypeNode` (PR #76, 2026-09-19). Lift this ignore
    # once openapi-typescript declares TypeScript 7 support.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Gradle: `rebase-strategy: disabled`, because a Dependabot rebase before the fix-up lands would
  # force-push the branch to a new head and invalidate the SHA-bound fix-up artifact (bring a stale
  # branch up to date with `gh pr update-branch` or `@dependabot recreate`, then re-run the fix-up).
  # What a Gradle PR lacks and how the fix-up is computed and applied:
  # `.claude/docs/dependency-reproducibility.md` ("the Dependabot fix-up is computed without
  # privilege and applied by a person"). The Netty and Reactor families move together
  # (`checkDependencyAlignment`), so they are excluded from the grouped PR and reviewed on their own.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "io.netty:*"
          - "io.projectreactor:*"
          - "io.projectreactor.netty:*"
          - "io.projectreactor.addons:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker: the two base images ARE the toolchain — `eclipse-temurin` must equal mise.toml's Java
  # (jvmToolchain(21), the CI setup-java version; `infrastructure.test.js` pins the parity) and
  # `node` mise.toml's Node major. A major bump there is a toolchain decision taken in mise.toml
  # first, never a dependency PR (the first run proposed Temurin 24 against the pinned 21), so
  # majors are ignored here; patch/minor tag moves (21.0.12, 26.x-alpine) flow. The Dockerfile
  # FROMs are tag@sha256 digest pins, so Dependabot bumps the tag and its digest together.
  - package-ecosystem: "docker"
    # "/" is the Dockerfile; "/k8s" the bundled PostgreSQL's tag@digest image in the Deployment.
    directories:
      - "/"
      - "/k8s"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Docker Compose: the demo stack's postgres/mailpit and the SSO overlay's stub IdP, all tag@digest
  # pinned. PostgreSQL majors are a data-directory upgrade (pg_upgrade), never a dependency PR, and the
  # overlay's Node major follows mise.toml like the Dockerfile's.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
