services:
  postgres:
    # Tag AND multi-arch digest, like the Dockerfile's base images; Dependabot's docker-compose
    # ecosystem bumps the pair. Keep the tag equal to k8s/postgres-deployment.yaml's.
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: toadie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: toadie
      POSTGRES_USER: toadie
      POSTGRES_PASSWORD: toadie
    ports:
      # Host port 5433 (not 5432) so Toadie can run beside Lettuce on the same machine;
      # in-network consumers still use postgres:5432.
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres 18+ images keep data in a versioned subdir of /var/lib/postgresql;
      # mounting the pre-18 /var/lib/postgresql/data path makes the container unhealthy.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toadie -d toadie"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    # Local mail catcher for the demo: password-reset and MFA email lands here.
    # Read it at http://localhost:8026 (8025 is Lettuce's).
    image: axllent/mailpit:v1.30@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    container_name: toadie-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Optional build identity for the telemetry process row (unset = empty = recorded as null).
      args:
        TOADIE_BUILD_VERSION: ${TOADIE_BUILD_VERSION:-}
        TOADIE_BUILD_COMMIT: ${TOADIE_BUILD_COMMIT:-}
    container_name: toadie-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/toadie
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/toadie
      POSTGRES_USER: toadie
      POSTGRES_PASSWORD: toadie
      # This compose file is the LOCAL DEMO (clone & run over plain http://localhost:8081).
      # Development mode keeps HSTS/HTTPS-redirect off and tolerates the demo credentials
      # below. Any real deployment runs the image as shipped (KTOR_DEVELOPMENT=false), which
      # fail-closes on this JWT key and on the seeded 'changeme' password.
      KTOR_DEVELOPMENT: "true"
      # Local demo enables the API; other deployments must opt in explicitly.
      INTEGRATION_ENABLED: "true"
      # Bundled-demo signing key so tokens can't be forged with the placeholder "secret".
      # It is committed to the repo and therefore BURNED: production mode refuses to start
      # with it. Set your own (e.g. `openssl rand -hex 32`) for any real deployment.
      JWT_SECRET: "${JWT_SECRET:-dev-only-00366d050fa2c920f7efb9a880b8b9c60e693b1797e782a33ddbfb51f88ea9d0}"
      # Real SMTP delivery into the bundled Mailpit (the image default is MAIL_TRANSPORT=disabled).
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAIL_FROM: toadie@localhost
      # The URL password-reset / MFA emails link to. localhost is right for the one-machine
      # demo only — set MAIL_APP_URL to the address other people reach the stack at.
      MAIL_APP_URL: "${MAIL_APP_URL:-http://localhost:8081}"
      # OpenTelemetry passthrough (.claude/docs/observability.md). The defaults equal the code's own
      # (core/.../OpenTelemetry.kt), so leaving these unset changes nothing. To ship to a collector,
      # also set OTEL_EXPORTER_OTLP_ENDPOINT (and OTEL_EXPORTER_OTLP_PROTOCOL when not http/protobuf)
      # — deliberately not defaulted here, a default endpoint is not neutral for gRPC.
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-none}"
      OTEL_METRICS_EXPORTER: "${OTEL_METRICS_EXPORTER:-none}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-console}"
    ports:
      - "127.0.0.1:8081:8081"
    # Ceiling for the tuned JVM (SerialGC + -Xmx256m + C1, baked into bin/server): ~270 MiB RSS
    # under light load (a near-empty workspace), so 512 MiB leaves comfortable headroom and bounds
    # the container. The whole-workspace read peak against this limit (2026-10-24 capacity
    # probe) is recorded in
    # .claude/docs/security.md "Entity read memory budget" (Heap layout), together with the native-memory
    # bound the image sets (malloc arena cap, Dockerfile).
    mem_limit: 512m
    healthcheck:
      # eclipse-temurin's -jre base ships curl (verified: `docker run --rm eclipse-temurin:...-jre
      # which curl`), so probe the same /readyz the k8s Deployment uses (see k8s/app-deployment.yaml)
      # rather than reaching for a JVM-based check that would need its own JWT/DB wiring.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
