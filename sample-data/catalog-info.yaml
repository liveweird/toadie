# ---------------------------------------------------------------------------
# APIs — spec.type openapi/asyncapi/graphql/grpc/web-sockets, lifecycle, and a
# required spec.definition. No tags exist for this kind.
# ---------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: catalog-graphql
  namespace: default
  title: Catalog GraphQL API
  description: Product, category and availability queries for the storefront.
  labels:
    exposure: internal
    hosting-model: public-cloud
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: graphql
  lifecycle: production
  owner: group:default/retail-tribe
  system: system:default/storefront
  definition: |
    type Product {
      sku: ID!
      title: String!
      priceMinor: Int!
      available: Boolean!
    }

    type Query {
      product(sku: ID!): Product
      products(category: String, first: Int = 20): [Product!]!
    }
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: checkout-rest
  namespace: default
  title: Checkout REST API
  description: Cart-to-order conversion used by the storefront.
  labels:
    exposure: public
spec:
  type: openapi
  lifecycle: production
  owner: group:default/retail-tribe
  system: system:default/storefront
  definition: |
    openapi: 3.0.3
    info:
      title: Checkout REST API
      version: 2.0.0
    paths:
      /carts/{cartId}/checkout:
        post:
          summary: Convert a cart into an order
          responses:
            "201":
              description: Order created
            "409":
              description: Cart already checked out
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: live-cart
  namespace: default
  title: Live Cart socket
  description: Cart and stock updates pushed to an open browser session.
  labels:
    exposure: public
spec:
  type: web-sockets
  lifecycle: experimental
  owner: group:default/retail-tribe
  system: system:default/storefront
  definition: |
    # Frames are newline-delimited JSON, client-initiated subscribe then server push.
    -> {"op":"subscribe","cartId":"c_123"}
    <- {"op":"cart.updated","cartId":"c_123","lines":3,"totalMinor":8940}
    <- {"op":"stock.changed","sku":"SKU-9","available":false}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: order-events
  namespace: default
  title: Order events stream
  description: >-
    Order lifecycle events. Published by checkout-service and consumed by nobody
    in this workspace — deliberate, so the Graph shows a provider with no
    consumer and the relationship view has a loose end.
  labels:
    exposure: internal
spec:
  type: asyncapi
  lifecycle: experimental
  owner: group:default/retail-tribe
  system: system:default/storefront
  definition: |
    asyncapi: 2.6.0
    info:
      title: Order events
      version: 0.4.0
    channels:
      order.placed:
        subscribe:
          message:
            payload:
              type: object
              properties:
                orderId: { type: string }
                totalMinor: { type: integer }
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payments-grpc
  namespace: default
  title: Payments gRPC API
  description: Authorise and capture card payments.
  labels:
    exposure: partner
    hosting-model: on-premise
spec:
  type: grpc
  lifecycle: production
  owner: group:default/payments-squad
  system: system:default/payments
  definition: |
    syntax = "proto3";
    package acme.payments.v1;

    service Payments {
      rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
      rpc Capture(CaptureRequest) returns (CaptureResponse);
    }

    message AuthorizeRequest {
      string order_id = 1;
      int64 amount_minor = 2;
      string currency = 3;
    }
    message AuthorizeResponse { string authorization_id = 1; }
    message CaptureRequest { string authorization_id = 1; }
    message CaptureResponse { bool captured = 1; }
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: acquirer-rest
  namespace: external
  title: Acquirer REST API (third party)
  description: The acquirer's authorisation endpoint. We consume it; we do not own it.
  labels:
    exposure: partner
spec:
  type: openapi
  lifecycle: production
  owner: group:default/payments-squad
  system: system:external/acquirer
  definition: |
    openapi: 3.0.3
    info:
      title: Acquirer Authorisation API
      version: 1.0.0
    paths:
      /authorizations:
        post:
          summary: Authorise a card payment
          responses:
            "201":
              description: Authorised
            "402":
              description: Declined
---
