# Toadie sample landscape — a small e-commerce/payments software catalog.
#
# Every value in this file comes from the ADMIN-curated registries seeded by V22:
# the two namespaces, the four lifecycles, each kind's type dictionary, the eight
# label keys with their closed value lists, the four tag categories, and the four
# annotation keys. So the whole file passes a STRICT save — no waivers needed.
#
# Between them the documents use every seeded type value bar one (the Domain type
# `auxiliary` — there are only four Domains and two of them are genuinely `core-value`),
# which makes the editor's registry-backed Type/Lifecycle/Label/Tag/Annotation pickers
# checkable without inventing anything the registries would reject.
#
# Mind which registry applies to which kind — it is the thing most easily got wrong:
#   * tags       → Component and Resource only (Languages/Framework vs Database/Events)
#   * annotations→ never on Group or User
#   * lifecycle  → Component and API only
#   * labels     → per-key: criticality-tier/support-mode are System-only,
#                  data-classification/gdpr/pci-dss are Resource-only
#
# Four references are deliberately broken or unresolvable — see README.md.
#
# Load it: paste into the SPA's Import page (/files/import), or POST it through
# /api/v1/files/import (structured JSON — see README.md).

