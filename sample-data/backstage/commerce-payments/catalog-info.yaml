# Toadie Backstage demo — a small e-commerce/payments software catalog.
#
# This file is GENERATED, not hand-written: it is what the default conversion mapping
# (sample-data/port/commerce-payments/mapping/backstage.json) makes of the Port sample
# (sample-data/port/commerce-payments/) — the 42 entities of the eight blueprints the mapping covers
# (_team, _user, domain, system, service, library, api, resource); the 34 entities of the Port-only
# blueprints have no Backstage counterpart. SampleConversionTest pins that every document below IS that
# export, byte for structure, except the three hand-restored edits that carry the four deliberate reference
# findings (each marked "on purpose" below). To regenerate after a change to the Port sample or the mapping,
# follow "Regenerating this file" in README.md, then restore those three edits by hand.
#
# Every value in this file comes from the ADMIN-curated registries seeded by V22 (the System types re-curated by V50):
# the default namespace, the four lifecycles, each kind's type dictionary, the eleven
# label keys with their closed value lists, the four tag categories, and the four
# annotation keys. Registry values are valid, but four deliberate reference findings
# in catalog-service and legacy-invoicing require the import waiver; see README.md.
#
# Between them the documents use every seeded type value (bar three of the six System
# types — the sample has only five systems), which makes the editor's
# registry-backed Type/Lifecycle/Label/Tag/Annotation pickers checkable without inventing
# anything the registries would reject.
#
# Mind which registry applies to which kind — it is the thing most easily got wrong:
#   * tags       → Component and Resource only (Languages/Framework vs Database/Events)
#   * annotations→ never on Group or User
#   * lifecycle  → Component and API only
#   * labels     → per-key: criticality-tier/support-mode are System-only,
#                  data-classification is Resource-only, gdpr/pci-dss/banking-outsourcing
#                  span Component/API/Resource, cash-flow-impact/dora-cif are Component-only
#
# Load it: paste into the SPA's Import page (/files/import), or POST it through
# /api/v1/files/import (structured JSON — see README.md).

